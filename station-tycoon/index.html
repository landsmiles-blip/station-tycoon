function drawBackground(){
  const T=THEME();
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,T.bg1);g.addColorStop(0.55,T.bg0);g.addColorStop(1,'#02030A');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
  ctx.save();ctx.scale(S,S);
  NEB.forEach((n,i)=>{
    const t=G.time*0.018+i;
    const x=(n.x+Math.sin(t)*0.02)*FW,y=(n.y+Math.cos(t*0.8)*0.02)*FH,r=n.r*Math.max(FW,FH);
    const nc=T.neb[i%T.neb.length];
    const rg=ctx.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,withAlpha(nc,n.a));rg.addColorStop(1,withAlpha(nc,0));
    ctx.fillStyle=rg;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  });
  STARS.forEach(s=>{
    const px=((s.x*FW+G.time*s.d*5)%FW+FW)%FW,py=s.y*FH;
    const tw=0.55+0.45*Math.sin(G.time*s.sp+s.tw);
    ctx.fillStyle=(s.tw>5.6)?withAlpha(T.accent,(0.3+s.d*0.6)*tw)
                            :`rgba(255,255,255,${(0.28+s.d*0.62)*tw})`;
    ctx.beginPath();ctx.arc(px,py,s.s,0,TAU);ctx.fill();
  });
  ctx.restore();
}

/* One distinct silhouette per tier — colourblind-safe, and it makes the
   progression legible at a glance without reading a number. */
function drawModuleShape(tier,R){
  /* Each glyph is a machine you would recognise from a factory floor.
     Nothing here is a dish, a spike, a mine or a turret. */
  ctx.lineWidth=Math.max(2,R*0.1);ctx.lineJoin='round';ctx.lineCap='round';
  switch(tier){
    case 1: // ORE DRILL: housing block + fluted bit
      ctx.beginPath();ctx.rect(-R*0.44,-R*0.74,R*0.88,R*0.6);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-R*0.44,-R*0.14);ctx.lineTo(R*0.44,-R*0.14);
      ctx.lineTo(0,R*0.86);ctx.closePath();ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(-R*0.26,R*0.04);ctx.lineTo(R*0.2,R*0.3);
      ctx.moveTo(-R*0.17,R*0.36);ctx.lineTo(R*0.13,R*0.58);ctx.stroke();break;
    case 2: // REFINERY: pressure tank + outlet pipe + valve
      ctx.beginPath();ctx.ellipse(-R*0.16,0,R*0.54,R*0.44,0,0,TAU);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(R*0.34,-R*0.12);ctx.lineTo(R*0.72,-R*0.12);
      ctx.lineTo(R*0.72,R*0.46);ctx.stroke();
      ctx.beginPath();ctx.arc(-R*0.16,0,R*0.18,0,TAU);ctx.stroke();
      ctx.beginPath();ctx.arc(-R*0.16,0,R*0.06,0,TAU);ctx.fill();break;
    case 3: // CARGO CRANE: gantry + cable + suspended crate
      ctx.beginPath();ctx.moveTo(-R*0.66,R*0.68);ctx.lineTo(-R*0.66,-R*0.46);
      ctx.lineTo(R*0.6,-R*0.46);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-R*0.66,R*0.68);ctx.lineTo(R*0.06,R*0.68);ctx.stroke();
      ctx.beginPath();ctx.moveTo(R*0.32,-R*0.46);ctx.lineTo(R*0.32,R*0.02);ctx.stroke();
      ctx.beginPath();ctx.rect(R*0.1,R*0.02,R*0.44,R*0.42);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(R*0.1,R*0.23);ctx.lineTo(R*0.54,R*0.23);ctx.stroke();break;
    case 4: // FAB FOUNDRY: plant block + two stacks + sawtooth roof
      ctx.beginPath();ctx.rect(-R*0.7,-R*0.04,R*1.4,R*0.66);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.rect(-R*0.54,-R*0.64,R*0.24,R*0.6);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.rect(-R*0.06,-R*0.52,R*0.22,R*0.48);ctx.fill();ctx.stroke();
      ctx.beginPath();ctx.moveTo(R*0.3,-R*0.04);ctx.lineTo(R*0.62,-R*0.34);
      ctx.lineTo(R*0.62,-R*0.04);ctx.closePath();ctx.fill();ctx.stroke();break;
    case 5: // FUSION PLANT: hex containment + plasma core + 3 conduits
      ctx.beginPath();
      for(let i=0;i<6;i++){const a=i*TAU/6-Math.PI/6,x=Math.cos(a)*R*0.74,y=Math.sin(a)*R*0.74;
        i?ctx.lineTo(x,y):ctx.moveTo(x,y);}
      ctx.closePath();ctx.fill();ctx.stroke();
      for(let i=0;i<3;i++){const a=i*TAU/3;ctx.beginPath();
        ctx.moveTo(Math.cos(a)*R*0.3,Math.sin(a)*R*0.3);
        ctx.lineTo(Math.cos(a)*R*0.66,Math.sin(a)*R*0.66);ctx.stroke();}
      ctx.beginPath();ctx.arc(0,0,R*0.28,0,TAU);
      ctx.fillStyle=C.paper;ctx.fill();ctx.fillStyle=shade(TIER[4].c,-78);break;
    case 6: // SOLAR FARM: 2x2 panel array on a spine
      ctx.beginPath();ctx.moveTo(0,-R*0.8);ctx.lineTo(0,R*0.8);ctx.stroke();
      for(let gy=-1;gy<=1;gy+=2)for(let gx=-1;gx<=1;gx+=2){
        ctx.beginPath();ctx.rect(gx>0?R*0.08:-R*0.66,gy>0?R*0.08:-R*0.66,R*0.58,R*0.58);
        ctx.fill();ctx.stroke();}
      break;
    case 7: // QUANTUM FORGE: heavy ring + 4 bolts + white-hot core
      ctx.lineWidth=Math.max(3,R*0.17);
      ctx.beginPath();ctx.arc(0,0,R*0.6,0,TAU);ctx.stroke();
      ctx.lineWidth=Math.max(2,R*0.1);
      for(let i=0;i<4;i++){const a=i*TAU/4+TAU/8;ctx.beginPath();
        ctx.arc(Math.cos(a)*R*0.82,Math.sin(a)*R*0.82,R*0.13,0,TAU);ctx.fill();ctx.stroke();}
      ctx.beginPath();ctx.arc(0,0,R*0.26,0,TAU);
      ctx.fillStyle=C.paper;ctx.fill();ctx.fillStyle=shade(TIER[6].c,-78);break;
    case 8: // DYSON CORE: nested capture rings around a star
      for(let i=0;i<3;i++){ctx.save();ctx.rotate(i*Math.PI/3+G.time*0.5);
        ctx.beginPath();ctx.ellipse(0,0,R*0.92,R*0.3,0,0,TAU);ctx.stroke();ctx.restore();}
      ctx.beginPath();ctx.arc(0,0,R*0.34,0,TAU);
      ctx.fillStyle='#FFFFFF';ctx.fill();ctx.fillStyle=shade(TIER[7].c,-78);
      ctx.beginPath();ctx.arc(0,0,R*0.2,0,TAU);ctx.fill();break;
  }
}
function drawModule(m,R,lifted){
  const T=TIER[m.tier-1],s=(lifted?1.18:1)*easeOutBack(clamp(m.pop,0,1.2));
  ctx.save();ctx.translate(m.x,m.y);ctx.scale(s,s);
  if(lifted){ctx.save();ctx.globalAlpha=0.32;ctx.fillStyle='#000';
    ctx.beginPath();ctx.ellipse(0,R*1.15,R*0.8,R*0.24,0,0,TAU);ctx.fill();ctx.restore();}
  ctx.save();
  ctx.shadowColor=withAlpha(T.c,0.34+m.glow*0.6+(lifted?0.28:0));
  ctx.shadowBlur=R*(0.85+m.glow*1.4);
  const gr=ctx.createRadialGradient(-R*0.3,-R*0.36,R*0.1,0,0,R*1.05);
  gr.addColorStop(0,shade(T.c,52));gr.addColorStop(0.55,T.c);gr.addColorStop(1,shade(T.c,-62));
  ctx.fillStyle=gr;
  ctx.beginPath();ctx.arc(0,0,R*0.94,0,TAU);ctx.fill();
  ctx.shadowBlur=0;
  ctx.lineWidth=Math.max(1.6,R*0.055);ctx.strokeStyle=withAlpha('#FFFFFF',0.22);ctx.stroke();
  ctx.restore();
  ctx.save();ctx.rotate(m.spin*(m.tier>=6?0.35:0.12));
  ctx.fillStyle=shade(T.c,-78);ctx.strokeStyle=withAlpha('#FFFFFF',0.62);
  drawModuleShape(m.tier,R*0.72);ctx.restore();
  ctx.save();ctx.globalCompositeOperation='lighter';
  const rim=ctx.createLinearGradient(0,-R,0,R*0.2);
  rim.addColorStop(0,withAlpha('#FFFFFF',0.34));rim.addColorStop(1,withAlpha('#FFFFFF',0));
  ctx.fillStyle=rim;ctx.beginPath();ctx.arc(0,0,R*0.94,0,TAU);ctx.fill();ctx.restore();
  ctx.fillStyle='#0A0E1F';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font=f(800,R*0.7);ctx.fillText(String(m.tier),0,R*0.05);
  if(m.busy>0){   // packing a trader's crate: dimmed, crated, live countdown
    const k=clamp(m.busy/(m.busyMax||1),0,1);
    ctx.globalAlpha=0.6;ctx.fillStyle='#0A0E1F';
    ctx.beginPath();ctx.arc(0,0,R*0.94,0,TAU);ctx.fill();ctx.globalAlpha=1;
    ctx.fillStyle='#C08A4E';rr(ctx,-R*0.4,-R*0.32,R*0.8,R*0.68,R*0.1);ctx.fill();
    ctx.strokeStyle='#7A4F22';ctx.lineWidth=Math.max(1,R*0.06);ctx.stroke();
    ctx.beginPath();ctx.moveTo(-R*0.4,0);ctx.lineTo(R*0.4,0);
    ctx.moveTo(0,-R*0.32);ctx.lineTo(0,R*0.36);ctx.stroke();
    ctx.strokeStyle=C.gold;ctx.lineWidth=Math.max(2,R*0.1);ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,R*1.14,-Math.PI/2,-Math.PI/2+TAU*k);ctx.stroke();
  }
  ctx.restore();
}
function drawStation(){
  const x=L.hubX,y=L.hubY,base=Math.min(60,L.rad*0.36)*G.hubScale,gc=TIER[G.stationTier-1].c;
  ctx.save();ctx.translate(x,y);
  ctx.strokeStyle=withAlpha(C.slotHi,0.42);ctx.lineWidth=1.4;
  ctx.beginPath();ctx.arc(0,0,L.rad,0,TAU);ctx.stroke();
  ctx.save();ctx.rotate(G.time*0.12);
  ctx.strokeStyle=withAlpha(C.mint,0.15);ctx.lineWidth=2;ctx.setLineDash([7,15]);
  ctx.beginPath();ctx.arc(0,0,L.rad*1.2,0,TAU);ctx.stroke();ctx.setLineDash([]);ctx.restore();

  G.mods.forEach((m,i)=>{
    if(i>=G.slots)return;
    const a=slotAngle(i),p=slotPos(i);
    ctx.strokeStyle=withAlpha(m?TIER[m.tier-1].c:C.slotEdge,m?0.4:0.26);ctx.lineWidth=m?3:2;
    ctx.beginPath();ctx.moveTo(Math.cos(a)*base*0.85,Math.sin(a)*base*0.85);
    ctx.lineTo(p.x-x,p.y-y);ctx.stroke();
  });

  const gl=ctx.createRadialGradient(0,0,base*0.2,0,0,base*2.8);
  gl.addColorStop(0,withAlpha(gc,0.32+G.stationGlow*0.4));gl.addColorStop(1,withAlpha(gc,0));
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,base*2.8,0,TAU);ctx.fill();

  ctx.save();ctx.rotate(G.time*0.06);
  ctx.shadowColor=withAlpha(gc,0.8);ctx.shadowBlur=26+G.hubPulse*34;
  const hg=ctx.createRadialGradient(-base*0.3,-base*0.3,base*0.1,0,0,base);
  hg.addColorStop(0,C.hullLt);hg.addColorStop(0.6,C.hull);hg.addColorStop(1,C.hullDk);
  ctx.fillStyle=hg;ctx.strokeStyle=withAlpha(gc,0.85);ctx.lineWidth=3;
  ctx.beginPath();
  for(let i=0;i<6;i++){const a=i*TAU/6,px=Math.cos(a)*base,py=Math.sin(a)*base;i?ctx.lineTo(px,py):ctx.moveTo(px,py);}
  ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.restore();

  ctx.save();ctx.rotate(-G.time*0.5);ctx.strokeStyle=withAlpha(gc,0.9);ctx.lineWidth=3.4;
  ctx.beginPath();ctx.arc(0,0,base*0.52,0.4,2.5);ctx.stroke();
  ctx.beginPath();ctx.arc(0,0,base*0.52,3.6,5.7);ctx.stroke();ctx.restore();
  const core=ctx.createRadialGradient(0,0,0,0,0,base*0.34);
  core.addColorStop(0,'#FFFFFF');core.addColorStop(0.4,gc);core.addColorStop(1,withAlpha(gc,0));
  ctx.fillStyle=core;ctx.beginPath();ctx.arc(0,0,base*0.34*(1+G.hubPulse*0.3),0,TAU);ctx.fill();

  // slots: unlocked-empty vs locked. Locked slots advertise the progression.
  const R=modRadius();
  for(let i=0;i<MAXSLOTS;i++){
    if(G.mods[i])continue;
    const a=slotAngle(i),px=Math.cos(a)*L.rad,py=Math.sin(a)*L.rad,locked=i>=G.slots;
    ctx.save();ctx.translate(px,py);
    if(locked){
      ctx.globalAlpha=0.55;
      ctx.strokeStyle=withAlpha(C.slotEdge,0.85);ctx.lineWidth=2;ctx.setLineDash([3,6]);
      ctx.beginPath();ctx.arc(0,0,R*0.62,0,TAU);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=withAlpha(C.faint,0.95);
      rr(ctx,-R*0.2,-R*0.14,R*0.4,R*0.34,4);ctx.fill();
      ctx.strokeStyle=withAlpha(C.faint,0.95);ctx.lineWidth=2.4;
      ctx.beginPath();ctx.arc(0,-R*0.14,R*0.15,Math.PI,0);ctx.stroke();
    }else{
      const hot=G.hoverSlot===i;
      ctx.strokeStyle=withAlpha(hot?C.gold:C.slotEdge,hot?0.95:0.62);ctx.lineWidth=2;
      ctx.setLineDash([6,7]);ctx.lineDashOffset=-G.time*12;
      ctx.beginPath();ctx.arc(0,0,R*0.8,0,TAU);ctx.stroke();ctx.setLineDash([]);
      ctx.strokeStyle=withAlpha(C.faint,0.9);ctx.lineWidth=2.6;
      ctx.beginPath();ctx.moveTo(-R*0.24,0);ctx.lineTo(R*0.24,0);
      ctx.moveTo(0,-R*0.24);ctx.lineTo(0,R*0.24);ctx.stroke();
    }
    ctx.restore();
  }
  if(G.hoverSlot>=0&&G.mods[G.hoverSlot]){
    const p=slotPos(G.hoverSlot),pl=1+Math.sin(G.time*12)*0.06;
    ctx.save();ctx.translate(p.x-x,p.y-y);ctx.scale(pl,pl);
    ctx.strokeStyle=C.gold;ctx.lineWidth=4;ctx.shadowColor=C.gold;ctx.shadowBlur=20;
    ctx.beginPath();ctx.arc(0,0,R*1.3,0,TAU);ctx.stroke();ctx.restore();
  }
  ctx.restore();
}
function drawShip(s){
  /* A CARGO FREIGHTER. Blunt, boxy, stacked with containers, and it flies
     slowly and level. The old design was a sleek dart with a hot plume, which
     every player reads as an incoming fighter. */
  const q=(a,b,c,t)=>(1-t)*(1-t)*a+2*(1-t)*t*b+t*t*c;
  let x,y,ang;
  if(s.phase==='out'){
    const t=easeInOut(clamp(s.t,0,1));
    x=q(s.tx,s.tx+(s.ox+s.tx)*0.1,s.tx+s.ox,t);y=q(s.ty,s.ty-150,s.ty+s.oy,t);
    ang=Math.atan2(s.oy,-150);
  }else{
    const t=easeInOut(clamp(s.t,0,1));
    x=q(s.sx,s.cx,s.tx,t);y=q(s.sy,s.cy,s.ty,t);
    const nx=q(s.sx,s.cx,s.tx,Math.min(1,t+0.02)),ny=q(s.sy,s.cy,s.ty,Math.min(1,t+0.02));
    ang=Math.atan2(ny-y,nx-x)*(s.phase==='dock'?0.25:1);
  }
  const R=15;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang*0.5);

  // docking tether: an umbilical of light from ship to station while unloading
  if(s.phase==='dock'){
    const hx=(s.mx===undefined?L.hubX:s.mx)-x,hy=(s.my===undefined?L.hubY:s.my)-y,hl=Math.hypot(hx,hy)||1;
    ctx.save();ctx.globalCompositeOperation='lighter';
    const bg=ctx.createLinearGradient(0,0,hx,hy);
    bg.addColorStop(0,withAlpha(C.gold,0.5));bg.addColorStop(1,withAlpha(C.gold,0));
    ctx.strokeStyle=bg;ctx.lineWidth=3+Math.sin(G.time*14)*1.2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(hx,hy);ctx.stroke();ctx.restore();
  }

  // soft thruster glow (small, cool, at the BACK - not a weapon flare)
  ctx.save();ctx.globalCompositeOperation='lighter';
  const tr=ctx.createRadialGradient(-R*1.5,0,0,-R*1.5,0,R*1.5);
  tr.addColorStop(0,withAlpha('#7FD8FF',s.phase==='dock'?0.12:0.42));
  tr.addColorStop(1,withAlpha('#7FD8FF',0));
  ctx.fillStyle=tr;ctx.beginPath();ctx.arc(-R*1.5,0,R*1.5,0,TAU);ctx.fill();ctx.restore();

  ctx.shadowColor=withAlpha(s.hue,0.5);ctx.shadowBlur=10;
  // hull: a fat cylinder, blunt nose
  const hg=ctx.createLinearGradient(0,-R*0.72,0,R*0.72);
  hg.addColorStop(0,'#E8EDFF');hg.addColorStop(0.45,C.hullLt);hg.addColorStop(1,C.hullDk);
  ctx.fillStyle=hg;
  ctx.beginPath();
  ctx.moveTo(R*1.05,0);
  ctx.quadraticCurveTo(R*0.9,-R*0.6,R*0.2,-R*0.62);
  ctx.lineTo(-R*1.25,-R*0.5);ctx.lineTo(-R*1.25,R*0.5);ctx.lineTo(R*0.2,R*0.62);
  ctx.quadraticCurveTo(R*0.9,R*0.6,R*1.05,0);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle=withAlpha('#FFFFFF',0.3);ctx.lineWidth=1.2;ctx.stroke();
  // cargo containers strapped along the spine: the reason this ship exists
  const cc=THEME().livery;
  for(let i=0;i<3;i++){
    ctx.fillStyle=cc[(i+(s.seed|0))%cc.length];
    ctx.globalAlpha=0.92;
    rr(ctx,-R*1.1+i*R*0.62,-R*0.3,R*0.5,R*0.6,2);ctx.fill();
    ctx.globalAlpha=1;ctx.strokeStyle='rgba(8,12,28,0.5)';ctx.lineWidth=1;
    rr(ctx,-R*1.1+i*R*0.62,-R*0.3,R*0.5,R*0.6,2);ctx.stroke();
  }
  // bridge window at the nose
  ctx.fillStyle=withAlpha('#BFE9FF',0.9);
  ctx.beginPath();ctx.ellipse(R*0.62,0,R*0.17,R*0.2,0,0,TAU);ctx.fill();
  ctx.restore();
}

/* CLONE — the late-game cash sink. Once the authored spine is done and the
   board sits at its slot cap, credits stop being able to become growth: merges
   need PAIRS, not money, so a market player's tips would sit dead in the bank
   (the 60-minute sim measured an attentive player finishing BEHIND an idle one
   for exactly this reason). Clone converts dead cash back into the compounding
   loop: pay ~90 seconds of a stranded machine's output to duplicate it, which
   hands you the merge pair you were missing. It only ever appears when there
   is a stranded machine AND a free slot, so it never offers what the board
   cannot use. Authored spine untouched: it does not exist before contract 14. */
const CLONE_SECS=90;
function cloneInfo(){
  if(G.contract<CONTRACTS.length)return null;
  if(G.slots-G.mods.filter(Boolean).length<1)return null;
  const counts={};G.mods.forEach(m=>{if(m)counts[m.tier]=(counts[m.tier]||0)+1;});
  let best=null;
  G.mods.forEach(m=>{if(m&&m.tier<MAXTIER&&counts[m.tier]===1&&(!best||m.tier>best.tier))best=m;});
  if(!best)return null;
  return {tier:best.tier,cost:Math.max(50,Math.round(rate(best.tier)*CLONE_SECS*(G.sectorMult||1)))};
}
function cloneExec(ci,free){
  let slot=-1;for(let i=0;i<G.slots;i++)if(!G.mods[i]){slot=i;break;}
  if(slot<0)return false;
  if(!free)G.coins-=ci.cost;
  G.mods[slot]=mkMod(slot,ci.tier);G.built++;
  const p=slotPos(slot);
  burstP(p.x,p.y,free?C.gold:C.mint,20,180,0.8);ring(p.x,p.y,free?C.gold:C.mint,90);
  toast((free?'FREE CLONE  \u00B7  T':'CLONED T')+ci.tier+'  \u2014  merge the pair',free?C.gold:C.mint,0.1);
  Audio2.fanfare();recompute();layout();saveGame();
  return true;
}
function tryClone(){
  const ci=cloneInfo();if(!ci)return false;
  if(G.coins<ci.cost){toast('CLONE NEEDS '+fmt(ci.cost)+' CREDITS',C.coral);Audio2.deny();return false;}
  return cloneExec(ci,false);
}

/* =====================================================================
   8h. THE DAILY RHYTHM — streak, daily contract, event cadence.  (R2)
   The research is unanimous that the games which hold players for a year
   run on APPOINTMENTS, not sessions: Duolingo's streak converts effort
   into identity (and player-owned safety valves — freezes — lift sticking,
   they do not weaken it); the merge genre's leader attributes its retention
   edge to EVENT CADENCE (~20 events/month growing to ~100); Gossip Harbor
   makes the order book itself the reason to return. Three pieces, all
   additive, all optional — missing any of them costs upside, never
   progress (the verb law):
   1. DAILY CONTRACT — one golden trader per calendar day docks with a big
      ticket that WAITS ALL DAY. An appointment, not a reflex test.
   2. STREAK — fulfilling it advances a 7-day calendar. Rewards are quoted
      in MINUTES OF YOUR OWN INCOME (the G12 dead-cash lesson: flat credit
      rewards rot at the cap; income-minutes scale forever), with perk
      TOKENS on days 3/5/7 that are ACTIONS (free clone, golden trader,
      rush hour), and earnable FREEZES that auto-absorb one missed day.
   3. EVENT CADENCE — a rotation engine fires roughly every 4 minutes:
      rush hour (×2 income empire-wide, 45s) or a golden trader (6× tip,
      22s fuse). The engine is the point: future events append to a table,
      exactly like identities do. Empire-wide by the C34 law.
   ===================================================================== */
const STREAK_CAL=[
  {min:2},{min:3},{min:5,perk:'clone'},{min:4},{min:6,perk:'surge',freeze:1},
  {min:5},{min:15,perk:'golden',freeze:1}];
const DAILY_MIN=10,DAILY_STREAK_BONUS=0.10;
const EVENT_FIRST=150,EVENT_EVERY=240,EVENT_JIT=90;
const RUSH_DUR=45,GOLDEN_FUSE=22,GOLDEN_MUL=6,FREEZE_MAX=2;
function streakInit(){return {n:0,day:null,best:0,freezes:0,gapDay:null,
  tokens:{clone:0,golden:0,surge:0},dailyDay:null};}
function streakState(){if(!G.streak)G.streak=streakInit();return G.streak;}
/* dayKey reads the LOCAL calendar day. G.dayShift is a dev/test seam (days
   added to 'today') so the whole rhythm is testable without waiting. */
const dayKey=(off)=>{const d=new Date(Date.now()+(((off||0)+(G.dayShift||0))*864e5));
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();};
function resolveStreakGap(){
  const s=streakState();if(!s.day)return;
  const today=dayKey();
  if(s.day===today||s.day===dayKey(-1))return;      // alive: today or yesterday
  if(s.gapDay===s.day)return;                        // already resolved once
  s.gapDay=s.day;
  if(s.freezes>0){s.freezes--;
    toast('STREAK FREEZE USED \u2014 your '+s.n+'-day streak survives the miss',C.mint,0.5);}
  else{s.n=0;
    toast('Streak reset \u2014 today\u2019s contract starts a new one',C.dim,0.5);}
}
function dailyInfo(){
  const s=streakState();
  const mins=DAILY_MIN*(1+DAILY_STREAK_BONUS*Math.min(s.n,7));
  return Math.max(250,Math.round((G.income||0)*60*mins));
}
function spawnDaily(){
  const pool=[];G.mods.forEach(m=>{if(m&&!m.busy)pool.push(m.tier);});
  const tier=pool.length?pool[(Math.random()*pool.length)|0]:1;
  G.orders.push({tier:tier,t:86400,life:86400,tip:dailyInfo(),leaving:0,daily:true,
    face:(Math.random()*4)|0,pop:0});
  streakState().dailyDay=dayKey();
  toast('DAILY CONTRACT DOCKED \u2014 one golden ticket, waits all day',C.goldLt,0.3);
  Audio2.orderIn();
}
function dailyTick(){
  if(!G.orders||TUT.active)return;        // never talks over the tutorial; it can wait a day
  const s=streakState(),today=dayKey();
  resolveStreakGap();
  if(s.dailyDay&&s.dailyDay!==today)
    G.orders.forEach(o=>{if(o.daily&&!(o.leaving>0))o.leaving=0.001;});   // yesterday's leaves
  const live=G.orders.some(o=>o.daily&&!(o.leaving>0));
  const leaving=G.orders.some(o=>o.daily&&o.leaving>0);
  if(!live&&!leaving&&s.dailyDay!==today)spawnDaily();
}
function advanceStreak(){
  const s=streakState(),today=dayKey();
  if(s.day===today)return false;           // once per calendar day, ever
  resolveStreakGap();                      // absorb a miss (freeze) or break first
  s.n++;s.day=today;s.best=Math.max(s.best,s.n);
  const c=STREAK_CAL[(s.n-1)%STREAK_CAL.length];
  const pay=Math.max(200,Math.round((G.income||0)*60*c.min));
  G.coins+=pay;G.earned+=pay;
  if(c.perk)s.tokens[c.perk]=(s.tokens[c.perk]||0)+1;
  if(c.freeze&&s.freezes<FREEZE_MAX)s.freezes++;
  floatTxt(L.hubX,L.hubY-modRadius()*1.6,'DAY '+s.n+' STREAK  +'+fmt(pay),C.goldLt,20);
  burstP(L.hubX,L.hubY,C.gold,30,240,1);ring(L.hubX,L.hubY,C.gold,180);
  G.shake=Math.max(G.shake,5);
  toast('STREAK DAY '+s.n+(c.perk?'  \u00B7  +1 '+c.perk.toUpperCase()+' TOKEN':'')
    +(c.freeze&&s.freezes<=FREEZE_MAX?'  \u00B7  FREEZES '+s.freezes+'/'+FREEZE_MAX:''),C.goldLt,0.2);
  Audio2.fanfare();saveGame();
  return true;
}
/* ---- the event rotation ---- */
const rushMul=()=>(G.event&&G.event.kind==='rush'&&G.event.t>0)?2:1;
function spawnGolden(){
  const pool=[];G.mods.forEach(m=>{if(m&&!m.busy&&!m.hostT&&!m.crackT)pool.push(m.tier);});
  const tier=pool.length?pool[(Math.random()*pool.length)|0]:1;

        *demandOf(tier)*(pf<1?1/pf:1)*GOLDEN_MUL));

    face:(Math.random()*4)|0,pop:0});

  const s=streakState();

function drawOverlay(title,sub,btns,accent){
  ctx.fillStyle='rgba(3,5,14,0.84)';ctx.fillRect(0,0,FW,FH);
  ctx.textAlign='center';ctx.textBaseline='middle';
  const lines=sub?(Array.isArray(sub)?sub:[sub]):[];
  const pad=12;
  /* FIT EVERY SCREEN. The whole stack is measured first and then compressed:
     title size, line spacing, button height and gap all shrink (never below the
     44px touch floor), and on a short or landscape screen the buttons flow into
     two columns with the last row centred. An overlay whose final button hangs
     off the bottom is a dead end on a real phone, and "no dead ends" is a
     platform requirement rather than a nicety. */
  let titleS=Math.min(50,FW*0.11),lh=26,bh=60,gap=15,cols=1;
  const rowsN=()=>Math.ceil(btns.length/cols);
  const need=()=>pad+titleS*1.7+(lines.length?20+lines.length*lh:0)
                 +(btns.length?18+rowsN()*bh+(rowsN()-1)*gap:0)+pad;
  if(need()>FH&&btns.length>2)cols=2;
  while(need()>FH&&(titleS>24||lh>17||bh>46||gap>7)){
    if(titleS>24)titleS-=2;else if(lh>17)lh-=1.5;else if(bh>46)bh-=2;else gap-=1.5;
  }
  const cy=pad+titleS*0.85;
  ctx.save();ctx.shadowColor=withAlpha(accent||C.gold,0.6);ctx.shadowBlur=30;
  ctx.fillStyle=C.paper;ctx.font=f(800,titleS);ctx.fillText(title,UX,cy);ctx.restore();
  let y=cy+titleS*0.85;
  if(lines.length){
    y+=20;

    lines.forEach((s,i2)=>ctx.fillText(s,UX,y+i2*lh));
    y+=lines.length*lh;
  }
  OVERLAY_BTNS=[];
  if(!btns.length)return;
  y+=18;
  const colW=Math.min(330,cols===1?FW*0.72:(FW*0.88-gap)/2);
  const inRow=r=>Math.min(cols,btns.length-r*cols);
  const labF=Math.max(13,Math.min(21,bh*0.35));
  btns.forEach((b,i2)=>{
    const col=i2%cols,row=(i2/cols)|0;
    const rw=inRow(row)*colW+(inRow(row)-1)*gap;

    const hot=ptr.down&&inRect(ptr,bx,by,colW,bh);
    if(b.primary)drawButton(bx,by,colW,bh,b.label,b.sub,true,hot);
    else{
      drawPanel(bx,by,colW,bh,bh*0.3,'rgba(255,255,255,0.07)',withAlpha(C.slotHi,0.95));
      ctx.fillStyle=C.paper;ctx.font=f(700,labF);
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.label,bx+colW/2,by+bh/2+1);
    }
    /* every overlay control carries its label, so a test (or an assistive
       layer) can pick a button by INTENT instead of by position */
    OVERLAY_BTNS.push({x:bx,y:by,w:colW,h:bh,label:b.label||'',fn:b.fn});
  });

}
function empireOf(sv){
  if(!sv)return null;
  let vents=Array.isArray(sv.ventures)?sv.ventures:null,activeV=sv.activeV||0,mult=sv.sectorMult||1;
  if(!vents&&Array.isArray(sv.outposts)&&sv.outposts.length){   // pre-franchise save
    vents=sv.outposts.map((o,i)=>({k:i,dividend:Math.round((o.income||0)/OUTPOST_EFF)}));
    const act=Array.isArray(sv.mods)?sv.mods.reduce((a,t)=>a+(t>=1?rate(t):0),0):0;
    vents.push({k:vents.length,dividend:Math.round(act)});activeV=vents.length-1;
  }
  if(!vents||vents.length<2)return null;
  const away=vents.reduce((a,v,i)=>i===activeV?a:a+(v.dividend!=null?v.dividend:v.income||0),0)
              *OUTPOST_EFF*mult;
  return {vents:vents,activeV:activeV,away:Math.round(away),mult:mult};
}
/* ATTRACT-MODE DIORAMA. The title screen's job is to make a stranger want the
   game in three seconds, and text cannot do that - motion can. So the menu
   plays the loop at you: machines orbit, two of them merge and pop, credits
   arc into a counter, a freighter docks and leaves. Nothing here is a video or
   an image asset; it is the shipped art running on a 12-second script. */
function drawDiorama(cx,cy,R,TT){
  const P=12,u=TT%P,TAU2=TAU;
  const pos=i=>({x:cx+Math.cos(-Math.PI/2+i*TAU2/8)*R,y:cy+Math.sin(-Math.PI/2+i*TAU2/8)*R});
  ctx.save();
  const gl=ctx.createRadialGradient(cx,cy,0,cx,cy,R*2.3);
  gl.addColorStop(0,withAlpha(C.gold,0.10));gl.addColorStop(1,withAlpha(C.gold,0));
  ctx.fillStyle=gl;ctx.beginPath();ctx.arc(cx,cy,R*2.3,0,TAU2);ctx.fill();
  ctx.strokeStyle=withAlpha(C.slotHi,0.55);ctx.lineWidth=1.6;ctx.setLineDash([5,9]);
  ctx.beginPath();ctx.arc(cx,cy,R,0,TAU2);ctx.stroke();ctx.setLineDash([]);
  for(let i=0;i<8;i++){const p=pos(i);
    ctx.fillStyle=withAlpha(C.slotEdge,0.9);ctx.beginPath();ctx.arc(p.x,p.y,3,0,TAU2);ctx.fill();}
  const bob=i=>Math.sin(TT*1.4+i)*2.5;
  const mk=(t,x,y,age)=>({tier:t,x:x,y:y,pop:age===undefined?1:clamp(age/0.45,0.05,1),
                          spin:TT*0.5+i0hash(t),bob:0,glow:age!==undefined&&age<0.9?1-age:0,busy:0});
  function i0hash(t){return t*1.7;}
  // --- merge script: slots 0+1 (both T4) walk together at u=3.5, pop a T5 at 5
  const p0=pos(0),p1=pos(1),mid={x:(p0.x+p1.x)/2,y:(p0.y+p1.y)/2};
  const walking=u>3.5&&u<5,done=u>=5,age=done?u-5:0;
  const rr2=Math.min(34,R*0.30);
  if(!done){
    const k=walking?easeInOut((u-3.5)/1.5):0;
    const a={x:lerp(p0.x,mid.x,k),y:lerp(p0.y,mid.y,k)+bob(0)};
    const b={x:lerp(p1.x,mid.x,k),y:lerp(p1.y,mid.y,k)+bob(1)};
    drawModule(mk(4,a.x,a.y),rr2,false);drawModule(mk(4,b.x,b.y),rr2,false);
    if(walking){ctx.strokeStyle=withAlpha(C.goldLt,0.5+0.4*Math.sin(TT*9));ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();}
  }else{
    drawModule(mk(5,mid.x,mid.y+bob(5),age),rr2*1.12,false);
    if(age<1.1){const t=age/1.1;
      for(let k2=0;k2<14;k2++){const a2=k2*TAU2/14+0.4,d=R*(0.25+t*1.05);
        ctx.fillStyle=withAlpha(k2%3?TIER[4].c:C.goldLt,(1-t)*0.8);
        ctx.beginPath();ctx.arc(mid.x+Math.cos(a2)*d,mid.y+Math.sin(a2)*d,2.6*(1-t)+0.6,0,TAU2);ctx.fill();}}
    if(age<2.2){const t=age/2.2;
      ctx.fillStyle=withAlpha(C.gold,1-t);ctx.font=f(800,15);ctx.textAlign='center';
      ctx.fillText('+1,240',mid.x,mid.y-R*0.52-t*22);}
    if(u>6.4)drawModule(mk(2,p0.x,p0.y+bob(0),u-6.4),rr2,false);   // slot refills
    else{ctx.strokeStyle=withAlpha(C.slotHi,0.5);ctx.lineWidth=1.4;ctx.setLineDash([3,4]);
      ctx.beginPath();ctx.arc(p0.x,p0.y,rr2*0.7,0,TAU2);ctx.stroke();ctx.setLineDash([]);}
    drawModule(mk(4,p1.x,p1.y+bob(1)),rr2,false);
  }
  [2,3,4].forEach((sl,j)=>{const p=pos(sl);drawModule(mk([3,5,2][j],p.x,p.y+bob(sl)),rr2,false);});
  // --- credits arc from every live machine into a counter chip
  const ccx=cx-R*1.55,ccy=cy-R*1.30;
  drawPanel(ccx-34,ccy-12,68,24,12,'rgba(10,14,31,0.85)',withAlpha(C.gold,0.6));
  drawCoin(ccx-20,ccy,7,1);
  ctx.fillStyle=C.gold;ctx.font=f(800,12);ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillText(fmt(1200+Math.floor((TT*37)%850)),ccx-9,ccy+0.5);
  for(let i=0;i<5;i++){
    const p=pos(i===0?2:i+1),t=((TT*0.55+i*0.37)%1);
    const x=lerp(p.x,ccx,t),y=lerp(p.y,ccy,t)-Math.sin(t*Math.PI)*R*0.5;
    ctx.fillStyle=withAlpha(C.gold,(t<0.1?t*10:1)*0.85);
    ctx.beginPath();ctx.arc(x,y,2.6,0,TAU2);ctx.fill();
  }
  // --- freighter: in, berth + umbilical + pay, out
  if(u>7&&u<11.2){
    const p=pos(3),bx2=p.x+Math.cos(-Math.PI/2+3*TAU2/8)*30,by2=p.y+Math.sin(-Math.PI/2+3*TAU2/8)*30;
    let t,px,py,ph;
    if(u<8.3){t=(u-7)/1.3;ph='in';}
    else if(u<9.8){t=1;ph='dock';}
    else{t=1-(u-9.8)/1.4;ph='out';}
    const sx=cx+R*3.1,sy=cy-R*2.5;
    px=lerp(sx,bx2,easeOutCubic(clamp(ph==='out'?1-t:t,0,1)));
    py=lerp(sy,by2,easeOutCubic(clamp(ph==='out'?1-t:t,0,1)));
    if(ph==='dock'){
      ctx.strokeStyle=withAlpha(C.mint,0.7);ctx.lineWidth=2;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.setLineDash([]);
      for(let k2=0;k2<4;k2++){const tt=((TT*1.3+k2*0.25)%1);
        ctx.fillStyle=withAlpha(C.goldLt,0.9);
        ctx.beginPath();ctx.arc(lerp(p.x,px,tt),lerp(p.y,py,tt),2.4,0,TAU2);ctx.fill();}
    }
    ctx.save();ctx.translate(px,py);ctx.rotate(Math.atan2(by2-sy,bx2-sx));
    ctx.fillStyle=C.hullLt;rr(ctx,-16,-7,32,14,6);ctx.fill();
    ctx.fillStyle=C.hullDk;rr(ctx,-16,-7,12,14,6);ctx.fill();
    ctx.fillStyle=withAlpha(C.mint,0.9);ctx.beginPath();ctx.arc(14,0,3,0,TAU2);ctx.fill();
    ctx.fillStyle=withAlpha(C.gold,0.5);ctx.beginPath();ctx.moveTo(-16,0);
    ctx.lineTo(-24-Math.sin(TT*20)*3,-3);ctx.lineTo(-24-Math.sin(TT*20)*3,3);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

function drawTitle(){

  rr(ctx,colCX-tw/2,tagY-11,tw,22,11);
  ctx.fillStyle=withAlpha(C.gold,0.13);ctx.fill();
  ctx.strokeStyle=withAlpha(C.gold,0.5);ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle=C.goldLt;ctx.fillText(tag,colCX,tagY+0.5);

  // ---- the three rules as chips
  const chipH=land?34:40, chipGap=8;
  const chipY=tagY+(land?22:26);
  const chipsH=land?chipH:chipH*3+chipGap*2;
  drawRuleChips(bx,chipY,colW,chipH,land,TT);

  // ---- goal strip
  const gy=chipY+chipsH+10,gh=24;
  rr(ctx,bx+10,gy,colW-20,gh,12);
  ctx.fillStyle=withAlpha(C.gold,0.14);ctx.fill();
  ctx.strokeStyle=withAlpha(C.gold,0.45);ctx.lineWidth=1.2;ctx.stroke();
  ctx.fillStyle=C.goldLt;ctx.font=f(800,12);
  ctx.fillText('GOAL:  COMPLETE ALL 14 CONTRACTS',colCX,gy+gh/2+0.5);

  // ---- the diorama: the loop, playing itself
  if(land){
    drawDiorama(FW*0.27,FH*0.5,Math.min(FH*0.30,FW*0.155),TT);
  }else{
    const dy0=gy+gh+14,dy1=stripY-12,bandH=dy1-dy0;
    if(bandH>110)drawDiorama(UX,dy0+bandH/2,Math.min(bandH*0.33,colW*0.34,118),TT);
  }

  // ---- empire strip drawn last so it sits above the diorama's glow
  if(emp){
    const sy2=stripY,I0=identOf(emp.activeV),n=emp.vents.length;
    drawPanel(bx,sy2,colW,stripH,13,'rgba(10,15,34,0.92)',withAlpha(I0.accent,0.7));
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=C.dim;ctx.font=f(700,10.5);
    ctx.fillText('YOUR FRANCHISE  \u00B7  '+n+' VENTURE'+(n===1?'':'S'),bx+14,sy2+13);
    ctx.textAlign='right';ctx.fillStyle=C.goldLt;ctx.font=f(800,11.5);
    ctx.fillText('AWAY  +'+fmt(emp.away)+'/s',bx+colW-14,sy2+13);
    const maxB=Math.max(1,Math.floor((colW-28)/16)),show=Math.min(n,maxB);
    ctx.textAlign='left';
    let nx=bx+14;
    for(let i=0;i<show;i++){
      const I=identOf(emp.vents[i].k),act=i===emp.activeV;
      ctx.save();ctx.beginPath();ctx.arc(nx+5,sy2+stripH-14,5,0,TAU);
      ctx.fillStyle=I.accent;ctx.fill();
      if(act){ctx.strokeStyle=C.paper;ctx.lineWidth=1.6;
        ctx.beginPath();ctx.arc(nx+5,sy2+stripH-14,7.6,0,TAU);ctx.stroke();}
      ctx.restore();nx+=16;
    }
    ctx.fillStyle=C.paper;ctx.font=f(700,11);
    ctx.fillText(emp.vents.slice(0,3).map(v=>ventureShort(v.k)).join('   \u00B7   ')+(n>3?'   \u00B7  +'+(n-3):''),
                 nx+4,sy2+stripH-13);
    ctx.textBaseline='alphabetic';ctx.textAlign='center';
  }
}
/* =====================================================================
   11b. TUTORIAL — coach marks over live gameplay.
   Design rules, learned the hard way (the first build shipped with NO
   onboarding and the player could not tell it was a tycoon game):
     * NON-BLOCKING. Input is never gated, so no step can soft-lock.
     * SELF-ADVANCING. Every step has a hard timer; if the player never
       performs the action it moves on anyway.
     * PERSISTED. Shown once. Re-openable from the pause menu.
     * The MERGE step guarantees two identical modules exist, because a
       tutorial that waits on a state the player cannot reach is a trap.
   ===================================================================== */
const TUT_STEPS=[
  // `auto` = advance on a timer regardless. `dwell` = anti soft-lock CEILING:
  // the step also advances the instant the player does the thing. Ceiling for a
  // player who touches nothing is 62s; a player who follows along is ~25s.
  {id:'build',  dwell:18, auto:0,   kind:'btn',
   title:'BUILD A MACHINE',
   body:'Tap BUILD. It installs an Ore Drill on the station ring. Machines are the only thing that makes credits \u2014 that is the whole game.'},
  {id:'earn',   dwell:8,  auto:4.0, kind:'bank',
   title:'THAT IS YOUR MONEY',
   body:'Each machine streams credits into this counter. Watch the coins fly. More and better machines = more credits per second.'},
  {id:'merge',  dwell:26, auto:0,   kind:'mods',
   title:'MERGE TO GET RICHER',
   body:'Drag a machine onto an IDENTICAL one. They fuse into the next tier, which pays MORE than the two did apart \u2014 and frees a slot.'},
  {id:'contract',dwell:14,auto:0,   kind:'card',
   title:'CONTRACTS ARE THE GOAL',
   body:'This is your objective. Finish all 14 contracts to complete the station. Each one pays a bonus and unlocks another build slot.'}
];
const TUT={
  active:false, i:0, t:0, hand:{x:0,y:0}, skipBtn:null,
  start(){ this.active=true; this.i=0; this.t=0; G.tutStep=0; this.prep(0); },
  stop(){ this.active=false; G.tutStep=-1; Platform.save('tutdone',1); },
  prep(i){
    const st=TUT_STEPS[i]; if(!st)return;
    G.tutStep=i; this.t=0;
    // Merge step: make sure the merge is actually possible right now.
    if(st.id==='merge'){
      const live=G.mods.map((m,k)=>m?k:-1).filter(k=>k>=0);
      if(live.length<2){
        for(let k=0;k<G.slots&&live.length<2;k++){
          if(!G.mods[k]){G.mods[k]=mkMod(k,1);G.mods[k].pop=0;live.push(k);recompute();}
        }
        if(live.length>=2)toast('TUTORIAL: a second Ore Drill was installed for you',C.mint,0.1);
      }else{
        // normalise to two of the same tier so the instruction is truthful
        const t0=G.mods[live[0]].tier;
        if(G.mods[live[1]].tier!==t0&&live[1]<G.slots){G.mods[live[1]]=mkMod(live[1],t0);recompute();}
      }
    }
  },
  isLast(){return this.i>=TUT_STEPS.length-1;},
  hit(id){
    if(!this.active)return;
    const st=TUT_STEPS[this.i]; if(!st||st.id!==id)return;
    this.next();
  },
  next(){ if(this.i<TUT_STEPS.length-1){this.i++;this.prep(this.i);} else this.stop(); },
  update(dt){
    if(!this.active)return;
    this.t+=dt;
    const st=TUT_STEPS[this.i];
    if(!st){this.stop();return;}
    if(st.auto&&this.t>=st.auto){this.next();return;}          // timed step
    if(this.t>=st.dwell){this.next();return;}                  // anti soft-lock
  },
  // Screen rect of the thing to spotlight, in design space.
  rect(){
    const st=TUT_STEPS[this.i]; if(!st)return null;
    const P=12;
    if(st.kind==='btn'&&BUILD_BTN.w)return{x:BUILD_BTN.x-P,y:BUILD_BTN.y-P,w:BUILD_BTN.w+P*2,h:BUILD_BTN.h+P*2};
    if(st.kind==='bank'){const t=credTarget();
      return{x:L.hudX-P,y:t.y-46,w:Math.min(240,L.cardW||FW*0.7),h:104};}
    if(st.kind==='card')return{x:L.cardX-P,y:L.cardY-P,w:L.cardW+P*2,h:78+P*2};
    if(st.kind==='mods'){
      const live=G.mods.map((m,k)=>m?k:-1).filter(k=>k>=0&&k<G.slots);
      if(!live.length)return null;
      const R=modRadius();
      if(live.length===1){const m=G.mods[live[0]];
        return{x:m.x-R*2.1,y:m.y-R*2.1,w:R*4.2,h:R*4.2};}
      const a=G.mods[live[0]],b=G.mods[live[1]];
      const x0=Math.min(a.x,b.x)-R*1.5,x1=Math.max(a.x,b.x)+R*1.5;
      const y0=Math.min(a.y,b.y)-R*1.5,y1=Math.max(a.y,b.y)+R*1.5;
      return{x:x0,y:y0,w:x1-x0,h:y1-y0,a,b};
    }
    return null;
  }
};
function drawTutHand(x,y,drag){
  const bob=Math.sin(G.time*3.4)*5;
  ctx.save();ctx.translate(x,y+bob);
  if(drag){ // dashed travel arc + arrowhead
    ctx.strokeStyle=withAlpha('#FFFFFF',0.85);ctx.lineWidth=3;ctx.setLineDash([7,7]);
    ctx.lineDashOffset=-G.time*34;
    ctx.beginPath();ctx.moveTo(drag.x-x,drag.y-y);
    ctx.quadraticCurveTo((drag.x-x)*0.5,(drag.y-y)*0.5-40,0,0);ctx.stroke();ctx.setLineDash([]);
  }
  ctx.shadowColor='rgba(0,0,0,0.55)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
  ctx.fillStyle='#FFFFFF';ctx.strokeStyle='#1B2440';ctx.lineWidth=1.6;
  ctx.beginPath();
  ctx.moveTo(0,0);ctx.lineTo(0,19);ctx.lineTo(4.9,14.6);ctx.lineTo(8,21.4);
  ctx.lineTo(11.4,19.9);ctx.lineTo(8.3,13.1);ctx.lineTo(14.2,12.6);
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.restore();
}
function drawTutorial(){
  if(!TUT.active||G.scene!=='play')return;
  const st=TUT_STEPS[TUT.i],r=TUT.rect();
  // dim with 4 rects (never destination-out: that would erase the game itself)
  ctx.save();ctx.fillStyle='rgba(4,7,20,0.62)';
  const H=FW,W=FH;
  if(r){
    const x0=Math.max(0,r.x),y0=Math.max(0,r.y),x1=Math.min(H,r.x+r.w),y1=Math.min(W,r.y+r.h);
    ctx.fillRect(0,0,H,y0);ctx.fillRect(0,y1,H,W-y1);
    ctx.fillRect(0,y0,x0,y1-y0);ctx.fillRect(x1,y0,H-x1,y1-y0);
    // spotlight rim
    ctx.strokeStyle=withAlpha(C.gold,0.95);ctx.lineWidth=3;
    ctx.shadowColor=withAlpha(C.gold,0.8);ctx.shadowBlur=18;
    rr(ctx,x0,y0,x1-x0,y1-y0,18);ctx.stroke();ctx.shadowBlur=0;
    // pulse
    const pu=(Math.sin(G.time*3.1)+1)/2;
    ctx.globalAlpha=0.35*(1-pu);ctx.strokeStyle=C.goldLt;ctx.lineWidth=2;
    rr(ctx,x0-8-pu*10,y0-8-pu*10,(x1-x0)+16+pu*20,(y1-y0)+16+pu*20,24);ctx.stroke();
    ctx.globalAlpha=1;
  }else ctx.fillRect(0,0,H,W);
  ctx.restore();

  // hand gesture
  if(st.kind==='btn'&&BUILD_BTN.w)drawTutHand(BUILD_BTN.x+BUILD_BTN.w*0.5,BUILD_BTN.y+BUILD_BTN.h*0.5,false);
  if(st.kind==='mods'&&r&&r.a&&r.b)drawTutHand(r.a.x,r.a.y,{x:r.b.x,y:r.b.y});

  // speech bubble, placed clear of the spotlight
  const bw=Math.min(FW-36,L.landscape?(L.cardW+40):FW-36),bh=124;
  const spotBottom=r?r.y+r.h:FH*0.4;
  let bx=(FW-bw)/2, by;
  if(!r)by=FH*0.5-bh/2;
  else if(spotBottom+bh+26<FH-(L.barH||0))by=Math.max(spotBottom+22,L.cardY+90);
  else by=Math.max(8,(r.y-bh-22));
  by=clamp(by,8,FH-bh-8);
  drawPanel(bx,by,bw,bh,18,'rgba(10,15,34,0.97)',withAlpha(C.gold,0.85));
  ctx.textAlign='left';ctx.textBaseline='middle';
  ctx.fillStyle=C.gold;ctx.font=f(800,15);
  ctx.fillText('STEP '+(TUT.i+1)+' OF '+TUT_STEPS.length+'   \u00B7   '+st.title,bx+18,by+24);
  ctx.fillStyle=C.paper;ctx.font=f(600,15);
  wrapText(st.body,bx+18,by+50,bw-36-84,21);
  // step pips
  const px=bx+18,py=by+bh-20;
  TUT_STEPS.forEach((_,k)=>{ctx.beginPath();ctx.arc(px+k*15,py,4.4,0,TAU);
    ctx.fillStyle=k<TUT.i?C.gold:(k===TUT.i?C.mint:'rgba(255,255,255,0.22)');ctx.fill();});
  // SKIP
  const sw=68,sh=30,sx=bx+bw-sw-14,sy=by+bh-sh-12;
  TUT.skipBtn={x:sx,y:sy,w:sw,h:sh};
  const hot=ptr.down&&inRect(ptr,sx,sy,sw,sh);
  rr(ctx,sx,sy,sw,sh,15);ctx.fillStyle=hot?'rgba(255,255,255,0.2)':'rgba(255,255,255,0.09)';ctx.fill();
  ctx.strokeStyle=withAlpha(C.dim,0.8);ctx.lineWidth=1.4;ctx.stroke();
  ctx.fillStyle=C.paper;ctx.font=f(700,13);ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('SKIP',sx+sw/2,sy+sh/2+1);
}
function wrapText(txt,x,y,maxW,lh){
  const words=txt.split(' ');let line='',yy=y;
  for(const w of words){
    const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,x,yy);yy+=lh;line=w;}
    else line=t;
  }
  if(line)ctx.fillText(line,x,yy);
  return yy;
}

function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBackground();
  ctx.save();ctx.scale(S,S);
  if(G.shake>0.2){const s=G.shake;ctx.translate((Math.random()-0.5)*s,(Math.random()-0.5)*s);}
  if(G.scene!=='title'){drawStation();G.ships.forEach(drawShip);}
  const R=modRadius();
  G.mods.forEach(m=>{if(m&&(!G.drag||G.drag.mod!==m)){drawModule(m,R,false);drawCrop(m,R);}});
  if(G.drag)drawModule(G.drag.mod,R,true);
  drawEffects();
  if(G.scene==='play'||G.scene==='paused'){drawHUD();drawContract();drawBottomBar();drawOrders();drawGuests();drawRoutes();drawTanks();}
  drawTutorial();
  if(G.scene==='title')drawTitle();
  if(G.scene==='paused')drawOverlay('PAUSED',
    ['Station systems on standby.','Credits banked: '+fmt(G.earned)+'   ·   Merges: '+G.merges],
    [{label:'RESUME',primary:true,fn:resumeGame},
     ...(G.ventures&&G.ventures.length>1?[{label:'SWITCH VENTURE',fn:openSwitch}]:[]),
     ...(charterReady()?[{label:'EXPANSION CHARTER  (READY)',fn:()=>{G.scene='sector';}}]:[]),
     {label:'HOW TO PLAY',fn:()=>{resumeGame();TUT.start();}},
     {label:'RESTART STATION',fn:restart},
     {label:Audio2.isMuted()?'SOUND: OFF':'SOUND: ON',fn:()=>{Audio2.setMuted(!Audio2.isMuted());Platform.setAudioEnabled(!Audio2.isMuted());}}],C.mint);
  if(G.scene==='sector')drawCharter();
  if(G.scene==='switch')drawSwitch();
  if(G.scene==='travel')drawTravel();
  if(G.scene==='return')drawReturnPile();
  if(G.scene==='returngoal')drawReturnGoal();
  if(G.scene==='streak')drawStreakPanel();
  /* THE END OF THE SPINE IS THE METAMORPHOSIS BEAT. The player has just
     finished the authored game at ~9:30 - inside their first session - so this
     overlay is where act II is offered, as the PRIMARY action, ahead of both
     "keep building" and "play again". Nothing here restarts anything. */
  if(G.scene==='done')drawOverlay('EMPIRE COMPLETE',
    ['Every contract fulfilled. The Dyson Core is yours.',
     'Your station can now METAMORPHOSE into a new business:',
     'same machines, same slots, same credits \u2014 nothing resets, nothing is lost.',
     ventureName(G.activeV||0)+' becomes a branch and keeps paying you.',
     'Total banked: '+fmt(G.earned),
     'Merges: '+G.merges+'   ·   Ships docked: '+G.shipsDocked],
    charterReady()
      ?[{label:'OPEN EXPANSION CHARTER',sub:'metamorphose  ·  nothing is lost',primary:true,fn:openCharter},
        {label:'KEEP BUILDING',fn:()=>{Platform.clearPaused();G.scene='play';}},
        {label:'PLAY AGAIN',fn:restart}]
      :[{label:'KEEP BUILDING',primary:true,fn:()=>{Platform.clearPaused();G.scene='play';}},
        {label:'PLAY AGAIN',fn:restart}],C.gold);
  ctx.restore();
  ctx.setTransform(1,0,0,1,0,0);
}

/* =====================================================================
   12. MAIN LOOP
   ===================================================================== */
// Juice is presentation, not simulation: it decays on the WALL CLOCK so that
// no pause, freeze or backgrounded tab can ever strand a full-strength shake.
function juice(dt){
  if(!G)return;
  G.shake=Math.max(0,G.shake-G.shake*7*dt-0.6*dt);
  G.flash=Math.max(0,G.flash-dt*1.9);
}
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;dt=Math.min(dt,0.25);
  juice(dt);
  if(G&&G.scene==='title')G.titleT=(G.titleT||0)+dt;   // the menu runs on wall clock
  if(G&&G.travel){G.travel.t+=dt;if(G.travel.t>=1.25)arriveTravel();}
  if(!Platform.isPaused()){
    acc+=dt;let guard=0;
    while(acc>=STEP&&guard++<12){update(STEP);acc-=STEP;}
    if(guard>=12)acc=0;
  }else G.time+=dt*0.35;
  render();
}

newGame(false);layout();Platform.init();
// GameReady fires only once the first frame is genuinely drawable.
requestAnimationFrame(t=>{last=t;render();Platform.gameReady();requestAnimationFrame(frame);});
window.addEventListener('resize',()=>{resize();layout();});
console.log('%c STATION TYCOON v0.2 ','background:#FFC53D;color:#0A0E1F;font-weight:800','platform:',Platform.name);
</script>
