<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070F">
<title>Station Tycoon</title>
<style>
  /* =====================================================================
     STATION TYCOON — vertical slice v0.2 (tuned + validated)

     RESPONSIVE STRATEGY
     The canvas fills the whole viewport, so there are never black bars.
     A virtual design space of AT LEAST 390x720 units (phone-real, so one
     design unit is ~1 CSS px and text never renders sub-pixel) is recomputed on
     every resize and expanded along whichever axis has slack, so the same
     layout is correct at 9:16 (phone portrait, the primary surface),
     1:1 and 16:9 (desktop/TV). No element uses a hardcoded absolute
     screen position.

     RENDERING
     devicePixelRatio-aware backing store (capped at 3 for fill-rate), so
     nothing is ever blurry — an explicit Google Playables MUST.

     FIXED TIMESTEP
     An accumulator drives a 120Hz simulation with clamped dt, so the game
     runs at identical speed on 60Hz, 90Hz and 120Hz displays, and a
     backgrounded tab can never fast-forward the simulation.
     ===================================================================== */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    width:100%;height:100%;overflow:hidden;background:#05070F;
    /* System rounded stack — a friendly casual-game voice with zero
       external font download. Playables forbids external calls and the
       preview iframe has no network, so everything must be self-contained. */
    font-family:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Nunito",system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
    touch-action:none;user-select:none;-webkit-user-select:none;
  }
  #c{display:block;width:100vw;height:100vh;touch-action:none;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
"use strict";
/* =====================================================================
   0. PLATFORM ADAPTER
   One thin seam between the game and whatever portal it ships on.
   Playgama Bridge / ytgame / plain browser all resolve here, so changing
   distribution target later is a config change, not a rewrite.
   Every ad call checks support first (both Google and Playgama require
   it), and no ad ever gates progression.
   ===================================================================== */
const Platform = (() => {
  const bridge = (typeof window.bridge !== 'undefined') ? window.bridge : null;
  const yt     = (typeof window.ytgame !== 'undefined') ? window.ytgame : null;
  let audioEnabled = true, paused = false;
  const onPauseCbs = [], onResumeCbs = [], onAudioCbs = [];

  const store = {
    set(k, v){
      try { localStorage.setItem('st_' + k, JSON.stringify(v)); } catch (e) {}
      if (bridge && bridge.storage) { try { bridge.storage.set('st_' + k, v); } catch (e) {} }
    },
    get(k, dflt){
      try { const r = localStorage.getItem('st_' + k); if (r !== null) return JSON.parse(r); } catch (e) {}
      return dflt;
    }
  };

  return {
    name: bridge ? 'playgama-bridge' : yt ? 'ytgame' : 'browser',
    init(){
      const go = () => { if (yt && yt.requestGameStart) { try { yt.requestGameStart(); } catch (e) {} } };
      if (bridge && bridge.initialize) Promise.resolve(bridge.initialize()).then(go, go); else go();
      if (yt) {
        if (yt.onPause)  yt.onPause(()  => { paused = true; onPauseCbs.forEach(f => f()); });
        if (yt.onResume) yt.onResume(() => { paused = false; onResumeCbs.forEach(f => f()); });
        if (yt.isAudioEnabled) audioEnabled = !!yt.isAudioEnabled();
        if (yt.onAudioEnabledChange) yt.onAudioEnabledChange(v => { audioEnabled = !!v; onAudioCbs.forEach(f => f(v)); });
      }
      // A backgrounded tab must never keep simulating.
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) { paused = true; onPauseCbs.forEach(f => f()); }
        else { paused = false; onResumeCbs.forEach(f => f()); }   // resume MUST resume
      });
    },
    gameReady(){ if (yt && yt.gameReady) { try { yt.gameReady(); } catch (e) {} } },
    onPause(f){ onPauseCbs.push(f); }, onResume(f){ onResumeCbs.push(f); },
    onAudioChange(f){ onAudioCbs.push(f); },
    isPaused(){ return paused; }, clearPaused(){ paused = false; },
    audioEnabled(){ return audioEnabled; },
    setAudioEnabled(v){ audioEnabled = v; onAudioCbs.forEach(f => f(v)); },
    interstitial(){ // natural transitions only — never on a timer, never mid-gameplay
      if (bridge && bridge.advertisement && bridge.advertisement.isInterstitialSupported) { try { bridge.advertisement.showInterstitial(); } catch (e) {} }
      else if (yt && yt.ads && yt.ads.showInterstitial) { try { yt.ads.showInterstitial(); } catch (e) {} }
    },
    rewarded(cb){ // strictly opt-in, and never required to continue
      if (bridge && bridge.advertisement && bridge.advertisement.isRewardedSupported) {
        try { bridge.advertisement.showRewardedVideo({ callbacks:{ onRewarded:()=>cb(true), onClose:()=>cb(false) } }); return; } catch (e) {}
      } else if (yt && yt.ads && yt.ads.showRewarded) {
        try { yt.ads.showRewarded({ onClose: r => cb(!!(r && r.isRewarded)) }); return; } catch (e) {}
      }
      cb(false);
    },
    save: store.set, load: store.get
  };
})();

/* =====================================================================
   1. AUDIO — 100% synthesised WebAudio. Zero asset bytes, zero external
      calls, and it obeys the platform mute command.
   ===================================================================== */
const Audio2 = (() => {
  let ac=null, master=null, musicGain=null, sfxGain=null, musicTimer=null, muted=false;
  function ensure(){
    if (ac){ if (ac.state==='suspended') ac.resume(); return true; }
    try{
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0.9; master.connect(ac.destination);
      musicGain = ac.createGain(); musicGain.gain.value = 0;   // routed through the score's mix chain
      sfxGain = ac.createGain(); sfxGain.gain.value = 0.85; sfxGain.connect(master);
      return true;
    }catch(e){ return false; }
  }
  const on = () => ac && !muted && Platform.audioEnabled();
  function tone(freq,dur,type,vol,slideTo,delay){
    if(!on())return;
    const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq,t0);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol||0.2,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(sfxGain); o.start(t0); o.stop(t0+dur+0.03);
  }
  function noise(dur,vol,hp){
    if(!on())return;
    const n=Math.floor(ac.sampleRate*dur),buf=ac.createBuffer(1,n,ac.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ac.createBufferSource();s.buffer=buf;
    const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp||600;
    const g=ac.createGain();g.gain.value=vol||0.15;
    s.connect(f);f.connect(g);g.connect(sfxGain);s.start();
  }
  /* =====================================================================
     THE SCORE — the project's own producer presets (Starlight / Neon /
     Botanica), ported NOTE-FOR-NOTE from the studio page and re-voiced as a
     LIVE WebAudio scheduler instead of baked WAVs: ~10 KB of code versus
     ~14 MB of audio per track, zero render freeze (a seconds-long main-thread
     block is exactly the freeze class this project gates against), a seamless
     32-bar loop, and a duck bus so the music breathes under the SFX.
     Every venture maps to a preset + variant (key, tempo, lead timbre) so each
     business still has its OWN music; circuit 2 lifts the key a fifth, so a
     prestige-tier business sounds like the same band, tuned brighter.
     ===================================================================== */
  const TRACKS={
    starlight:{bpm:98,leadType:'sawtooth',leadCutoff:1550,rootSemi:0,
      chordsA:[{bass:38,walk:45,notes:[50,53,57,60,64]},{bass:43,walk:47,notes:[47,53,57,59,64]},
               {bass:36,walk:43,notes:[48,52,55,59,62]},{bass:45,walk:49,notes:[49,55,57,61,65]}],
      chordsB:[{bass:41,walk:48,notes:[53,57,60,64,67]},{bass:40,walk:47,notes:[52,55,59,62,66]},
               {bass:38,walk:45,notes:[50,53,57,60,64]},{bass:43,walk:50,notes:[50,53,57,60,64]}],
      leadA:[{bar:0,step:2,m:69,d:0.75},{bar:0,step:5,m:72,d:0.5},{bar:0,step:7,m:74,d:1.25},
             {bar:0,step:12,m:72,d:0.5},{bar:0,step:14,m:69,d:1.5},{bar:1,step:12,m:67,d:0.5},
             {bar:1,step:14,m:69,d:0.5},{bar:2,step:0,m:71,d:1.25},{bar:2,step:5,m:72,d:0.5},
             {bar:2,step:7,m:76,d:1.5},{bar:2,step:13,m:74,d:0.75},{bar:3,step:0,m:73,d:1.5},
             {bar:3,step:6,m:69,d:2.0}],
      leadB:[{bar:0,step:0,m:76,d:1.5},{bar:0,step:6,m:74,d:0.5},{bar:0,step:8,m:72,d:1.0},
             {bar:0,step:12,m:69,d:1.0},{bar:1,step:0,m:71,d:1.5},{bar:1,step:6,m:74,d:1.0},
             {bar:1,step:10,m:76,d:1.5},{bar:2,step:2,m:79,d:1.25},{bar:2,step:7,m:76,d:0.75},
             {bar:2,step:10,m:74,d:1.25},{bar:2,step:14,m:72,d:0.5},{bar:3,step:0,m:74,d:2.5}],
      vibeAnswer:[76,74,72,69,71,74,76,79]},
    neon:{bpm:104,leadType:'sawtooth',leadCutoff:1850,rootSemi:3,
      chordsA:[{bass:41,walk:45,notes:[53,57,60,64,69]},{bass:43,walk:47,notes:[55,59,62,64,67]},
               {bass:40,walk:43,notes:[52,55,59,62,67]},{bass:45,walk:48,notes:[57,60,64,67,71]}],
      chordsB:[{bass:38,walk:45,notes:[50,53,57,60,64]},{bass:40,walk:47,notes:[52,55,59,62,67]},
               {bass:41,walk:48,notes:[53,57,60,64,69]},{bass:43,walk:50,notes:[55,59,62,67,71]}],
      leadA:[{bar:0,step:0,m:72,d:1.5},{bar:0,step:6,m:76,d:1.0},{bar:0,step:10,m:74,d:1.5},
             {bar:1,step:0,m:71,d:1.5},{bar:1,step:6,m:67,d:2.0},{bar:2,step:0,m:71,d:1.0},
             {bar:2,step:4,m:72,d:1.0},{bar:2,step:8,m:76,d:1.5},{bar:2,step:14,m:79,d:0.5},
             {bar:3,step:0,m:76,d:2.5}],
      leadB:[{bar:0,step:0,m:77,d:1.5},{bar:0,step:6,m:76,d:1.0},{bar:0,step:10,m:72,d:1.5},
             {bar:1,step:0,m:76,d:1.5},{bar:1,step:6,m:79,d:2.0},{bar:2,step:0,m:81,d:1.5},
             {bar:2,step:6,m:79,d:1.0},{bar:2,step:10,m:76,d:1.5},{bar:3,step:0,m:79,d:3.0}],
      vibeAnswer:[72,76,79,81,79,76,74,71]},
    botanica:{bpm:92,leadType:'triangle',leadCutoff:1350,rootSemi:5,
      chordsA:[{bass:43,walk:47,notes:[55,59,62,66,69]},{bass:42,walk:45,notes:[54,57,60,64,69]},
               {bass:47,walk:51,notes:[51,57,59,63,66]},{bass:40,walk:47,notes:[52,55,59,62,66]}],
      chordsB:[{bass:36,walk:43,notes:[48,52,55,59,62]},{bass:35,walk:42,notes:[47,54,57,59,63]},
               {bass:40,walk:47,notes:[52,55,59,62,66]},{bass:37,walk:45,notes:[49,55,57,61,64]}],
      leadA:[{bar:0,step:2,m:74,d:1.0},{bar:0,step:6,m:71,d:0.75},{bar:0,step:9,m:67,d:1.5},
             {bar:1,step:2,m:69,d:1.0},{bar:1,step:6,m:72,d:1.5},{bar:2,step:0,m:71,d:1.25},
             {bar:2,step:5,m:75,d:1.0},{bar:2,step:9,m:76,d:1.75},{bar:3,step:0,m:74,d:2.2}],
      leadB:[{bar:0,step:0,m:76,d:1.5},{bar:0,step:6,m:79,d:1.25},{bar:0,step:11,m:76,d:1.0},
             {bar:1,step:0,m:74,d:1.5},{bar:1,step:6,m:71,d:2.0},{bar:2,step:2,m:74,d:1.0},
             {bar:2,step:6,m:76,d:1.0},{bar:2,step:10,m:79,d:1.5},{bar:3,step:0,m:78,d:1.5},
             {bar:3,step:6,m:76,d:1.5}],
      vibeAnswer:[71,74,76,78,79,76,74,71]}};
  let MSPEC={root:220,p:'starlight',sh:0,bpm:0,lead:null};
  let mComp=null,duck=null,rev=null,dL=null,dR=null,nBuf=null,barIdx=0,nextBarT=0;
  const mHz=m=>440*Math.pow(2,(m-69)/12);
  const beat=()=>60/(TRACKS[MSPEC.p].bpm+(MSPEC.bpm||0));
  function buildMusicChain(){
    if(mComp||!ac)return;
    /* the studio's mastering chain, live: glue compressor, duck bus,
       2.8 s velvet convolution reverb, dotted-8th/quarter ping-pong delay */
    mComp=ac.createDynamicsCompressor();
    mComp.threshold.value=-13;mComp.knee.value=14;mComp.ratio.value=3.2;
    mComp.attack.value=0.012;mComp.release.value=0.22;
    musicGain.connect(mComp);mComp.connect(master);
    duck=ac.createGain();duck.gain.value=1;duck.connect(musicGain);
    rev=ac.createConvolver();
    const rl=Math.floor(ac.sampleRate*2.8),rb=ac.createBuffer(2,rl,ac.sampleRate);
    for(let ch=0;ch<2;ch++){const d=rb.getChannelData(ch);let lp=0;
      for(let i=0;i<rl;i++){const e=Math.pow(1-i/rl,2.4),w=(Math.random()*2-1)*e;
        lp=(lp+0.18*w)/1.18;d[i]=lp*0.55;}}
    rev.buffer=rb;
    const rg=ac.createGain();rg.gain.value=0.34;rev.connect(rg);rg.connect(duck);
    const STEP16=beat()/4;
    dL=ac.createDelay(2);dR=ac.createDelay(2);
    dL.delayTime.value=STEP16*3;dR.delayTime.value=STEP16*4;
    const df=ac.createBiquadFilter();df.type='lowpass';df.frequency.value=1450;
    const fb=ac.createGain();fb.gain.value=0.36;
    const pL=ac.createStereoPanner();pL.pan.value=-0.65;
    const pR=ac.createStereoPanner();pR.pan.value=0.65;
    const wet=ac.createGain();wet.gain.value=0.25;
    dL.connect(df);df.connect(dR);dR.connect(fb);fb.connect(dL);
    dL.connect(pL);pL.connect(wet);dR.connect(pR);pR.connect(wet);wet.connect(duck);
    const mk=(dur,pw)=>{const n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,pw);return b;};
    nBuf={snare:mk(0.16,2),hatC:mk(0.045,3.2),hatO:mk(0.24,1.6)};
  }
  const PUMP=0.7;
  function triggerSidechain(t0){
    if(PUMP<=0.01||!duck)return;
    const dip=1-0.56*PUMP;
    duck.gain.setValueAtTime(1,t0);
    duck.gain.linearRampToValueAtTime(dip,t0+0.018);
    duck.gain.exponentialRampToValueAtTime(1,t0+beat()*0.62);
  }
  /* ---- the five voices, ported verbatim ---- */
  function vLead(midi,t0,durBeats,prevMidi){
    if(!on())return;
    const P=TRACKS[MSPEC.p],dur=durBeats*beat(),freq=mHz(midi+MSPEC.sh);
    const startF=prevMidi!=null?mHz(prevMidi+MSPEC.sh):freq;
    const o1=ac.createOscillator(),o2=ac.createOscillator();
    o1.type=MSPEC.lead||P.leadType;o2.type='triangle';
    o1.frequency.setValueAtTime(startF,t0);o1.frequency.exponentialRampToValueAtTime(freq,t0+0.045);
    o2.frequency.setValueAtTime(startF*2,t0);o2.frequency.exponentialRampToValueAtTime(freq*2,t0+0.045);
    o2.detune.value=7;
    const vib=ac.createOscillator(),vg=ac.createGain();
    vib.frequency.value=5.5;vg.gain.setValueAtTime(0,t0);
    vg.gain.linearRampToValueAtTime(4.2,t0+Math.min(0.35,dur*0.5));
    vib.connect(vg);vg.connect(o1.frequency);
    const filt=ac.createBiquadFilter();filt.type='lowpass';filt.Q.value=2.4;
    filt.frequency.setValueAtTime(550,t0);
    filt.frequency.exponentialRampToValueAtTime(P.leadCutoff,t0+0.08);
    filt.frequency.exponentialRampToValueAtTime(780,t0+dur);
    const g=ac.createGain(),vel=0.075;
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vel,t0+0.03);
    g.gain.setValueAtTime(vel*0.85,t0+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur+0.12);
    const gs=ac.createGain();gs.gain.value=0.35;
    o1.connect(filt);o2.connect(gs);gs.connect(filt);filt.connect(g);
    g.connect(musicGain);g.connect(dL);g.connect(rev);
    o1.start(t0);o2.start(t0);vib.start(t0);
    o1.stop(t0+dur+0.15);o2.stop(t0+dur+0.15);vib.stop(t0+dur+0.15);
  }
  function vVibe(midi,t0,dur,panVal,vel){
    if(!on())return;
    const freq=mHz(midi+MSPEC.sh);
    const car=ac.createOscillator(),mod=ac.createOscillator(),mg=ac.createGain(),
          env=ac.createGain(),pan=ac.createStereoPanner();
    car.type='sine';mod.type='sine';car.frequency.value=freq;
    mod.frequency.value=freq*(MSPEC.p==='botanica'?4:3);
    mg.gain.setValueAtTime(freq*1.4,t0);mg.gain.exponentialRampToValueAtTime(0.5,t0+0.18);
    env.gain.setValueAtTime(0.0001,t0);env.gain.linearRampToValueAtTime(vel,t0+0.01);
    env.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    pan.pan.value=panVal;
    mod.connect(mg);mg.connect(car.frequency);car.connect(env);env.connect(pan);
    pan.connect(duck);pan.connect(rev);pan.connect(dL);
    car.start(t0);mod.start(t0);car.stop(t0+dur+0.05);mod.stop(t0+dur+0.05);
  }
  function vRhodes(midi,t0,dur,panVal,vel){
    if(!on())return;
    const freq=mHz(midi+MSPEC.sh);
    const o1=ac.createOscillator(),o2=ac.createOscillator(),
          filt=ac.createBiquadFilter(),g=ac.createGain(),pan=ac.createStereoPanner();
    o1.type='sine';o2.type='sawtooth';o1.frequency.value=freq;o2.frequency.value=freq;
    o2.detune.value=9;
    filt.type='lowpass';filt.frequency.setValueAtTime(950,t0);
    filt.frequency.exponentialRampToValueAtTime(360,t0+dur*0.85);
    const gS=ac.createGain();gS.gain.value=0.22;
    g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(vel,t0+0.025);
    g.gain.exponentialRampToValueAtTime(0.0005,t0+dur);
    pan.pan.value=panVal;
    o1.connect(filt);o2.connect(gS);gS.connect(filt);filt.connect(g);g.connect(pan);
    pan.connect(duck);pan.connect(rev);
    o1.start(t0);o2.start(t0);o1.stop(t0+dur+0.05);o2.stop(t0+dur+0.05);
  }
  function vBass(m1,m2,t0,dur){
    if(!on())return;
    const f1=mHz(m1+MSPEC.sh),f2=m2!=null?mHz(m2+MSPEC.sh):f1;
    const o=ac.createOscillator(),sub=ac.createOscillator(),
          filt=ac.createBiquadFilter(),g=ac.createGain();
    o.type='sawtooth';sub.type='sine';
    o.frequency.setValueAtTime(f1,t0);sub.frequency.setValueAtTime(f1*0.5,t0);
    if(m2!=null){o.frequency.exponentialRampToValueAtTime(f2,t0+dur*0.65);
      sub.frequency.exponentialRampToValueAtTime(f2*0.5,t0+dur*0.65);}
    filt.type='lowpass';filt.frequency.setValueAtTime(340,t0);
    filt.frequency.exponentialRampToValueAtTime(125,t0+dur*0.85);filt.Q.value=2;
    const gO=ac.createGain();gO.gain.value=0.35;
    g.gain.setValueAtTime(0.001,t0);g.gain.linearRampToValueAtTime(0.22,t0+0.03);
    g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    o.connect(gO);gO.connect(filt);sub.connect(filt);filt.connect(g);g.connect(musicGain);
    o.start(t0);sub.start(t0);o.stop(t0+dur+0.04);sub.stop(t0+dur+0.04);
  }
  function vKick(t0){
    if(!on())return;
    triggerSidechain(t0);
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='sine';o.frequency.setValueAtTime(130,t0);
    o.frequency.exponentialRampToValueAtTime(54,t0+0.07);
    o.frequency.exponentialRampToValueAtTime(39,t0+0.28);
    g.gain.setValueAtTime(0.001,t0);g.gain.linearRampToValueAtTime(0.36,t0+0.006);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+0.30);
    o.connect(g);g.connect(musicGain);o.start(t0);o.stop(t0+0.32);
  }
  function vSnare(t0,vel){
    if(!on())return;
    const o=ac.createOscillator(),gO=ac.createGain();
    o.type='triangle';o.frequency.setValueAtTime(220,t0);
    o.frequency.exponentialRampToValueAtTime(118,t0+0.08);

    const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=3600;
    const g=ac.createGain();g.gain.value=vel;
    s.connect(f);f.connect(g);g.connect(musicGain);s.start(t0);

  /* ---- the 32-bar arrangement, scheduled live, looping forever ---- */
  function scheduleBar(bar,t0){
    const P=TRACKS[MSPEC.p],BEAT=beat(),STEP16=BEAT/4,BAR=BEAT*4,S=MSPEC.sh;
    const isB=bar>=16&&bar<24,isBrk=bar>=24&&bar<28,isIntro=bar<2;
    const prog=isB?P.chordsB:P.chordsA,chord=prog[bar%4];

      if(bar%2===1)vKick(t0+BEAT*3.5);
      vSnare(t0+BEAT*1.0,1);vSnare(t0+BEAT*3.0,1);
      vSnare(t0+STEP16*7+0.02,0.32);
      if(bar%2===0)vSnare(t0+STEP16*15+0.02,0.38);

        const sw=(e%2===1)?0.032:0,isOpen=(e===7&&bar%2===1);
        vHat(t0+e*(BEAT*0.5)+sw,isOpen,isOpen?0.038:(e%2===1?0.026:0.016));}
    }
    for(let st=0;st<8;st++){
      const answer=(bar%2===1)||isB||isBrk;
      if(!answer&&st%2===1)continue;
      const note=P.vibeAnswer[(bar*2+st)%P.vibeAnswer.length];
      const sw=(st%2===1)?0.028:0,pan=Math.sin(st*1.3+bar)*0.55;
      vVibe(note,t0+st*(BEAT*0.5)+sw,BEAT*0.65,pan,answer?0.038:0.022);

      const phrase=isB?P.leadB:P.leadA,bi=bar%4;let prev=null;

    scoreNow(){ if(!ac||!mComp)return -1; const b=barIdx;scheduleBar(b,ac.currentTime+0.02);return b; },

    suspend(){ if(ac&&ac.state==='running')ac.suspend(); },

    build(){ tone(150,0.16,'sine',0.26,74); noise(0.1,0.1,320); },
    dock(){ const k=MSPEC.root/220; tone(620*k,0.11,'sine',0.1,880*k); tone(880*k,0.16,'sine',0.07,1180*k,0.07); },
    deny(){ tone(180,0.14,'sawtooth',0.09,110); },
    fanfare(){ [0,0.07,0.14,0.24].forEach((d,i)=>tone(392*Math.pow(1.26,i*1.5),0.4,'sine',0.16,null,d)); },
    contract(){ [0,0.09,0.18,0.3].forEach((d,i)=>tone(440*Math.pow(1.26,i*2),0.5,'triangle',0.2,null,d)); noise(0.3,0.08,900); },
    ui(){ tone(720,0.05,'sine',0.09,900); },
    orderIn(){ if(!ensure())return; tone(740,0.09,'triangle',0.07,980); tone(1180,0.11,'sine',0.05,1320,0.06); },

const SPINE_GATE=k=>k===0;

function synergyLinks(){
  let links=0;
  for(let i=0;i<G.slots;i++){const j=(i+1)%G.slots;
    if(G.mods[i]&&G.mods[j])links++;}
  return links;
}
function recompute(){
  // m.busy is only ever set by Grand Bazaar orders, so the authored Oreworks
  // balance stays bit-identical: every machine there has busy===undefined.
  const base=G.mods.reduce((s,m)=>s+((m&&!m.busy&&!m.hostT&&!m.crackT)
      ?rate(m.tier)*(m.crop?0.5:1)*(m.compostT>0?COMPOST_MUL:1):0),0);
  let hi=1;G.mods.forEach(m=>{if(m&&m.tier>hi)hi=m.tier;});
  G.stationTier=hi;
  const mult=G.sectorMult||1;
  let syn=1;
  if(mechIndex()===0)syn=1+0.08*mechPot()*synergyLinks();
  /* THE BAZAAR TRADES. Its machines idle at half rate: in a market you earn by
     selling to the traders who dock, not by standing still. Every other venture
     keeps passive:1, so the authored Oreworks balance is untouched. Promoted
     ventures still pay away income on their FULL potential - a managed branch
     does not suffer the owner's absence the way an unattended stall does. */
  G.activeIncome=base*syn*mult*passiveOf(G.activeV||0);
  G.outpostIncome=(G.ventures||[]).reduce((s,v,i)=>i===(G.activeV||0)?s:s+(v.dividend||v.income||0),0)
                  *OUTPOST_EFF*mult;
  G.income=G.activeIncome+G.outpostIncome;
}
// Build costs track the ACTIVE board only. Including outpost income here would
// price a brand-new sector-2 board out of reach of its own starter machines.
const buildCost=()=>Math.max(BAL.costFloor,Math.round(BAL.costK*((G.activeIncome||0)+BAL.costPad)));
/* =====================================================================
   8b. THE COMMISSION BOARD — continuation past the authored 14.
   Beaupre's principle, applied to goals instead of videos: do not ship one
   fixed ordering to an abstract audience; for THIS player, at THIS moment,
   rank candidate goals against their live state and offer the best one.
   Candidate goals are generated from the player's actual income, board,
   activity rates and session context, scored, and the top one is posted.
   Nothing here alters contracts 1-14: this layer only APPENDS.
   ===================================================================== */
const OFF_EFF=0.5, OFF_CAP_H=8;      // offline earnings: half rate, capped at 8h
const SECTOR_EVERY=5;                // legacy: superseded by GATE(k)=5+3k (kept for save-shape parity)
const OUTPOST_EFF=0.35, SECTOR_MULT=1.5;  // branches pay 35%; each metamorphosis x1.5
const counters=()=>({earned:G.earned,tier:G.stationTier,mods:G.mods.filter(Boolean).length,
                     ships:G.shipsDocked,merges:G.merges,built:G.built,
                     dispatch:G.sent||0,host:G.hosted||0,
                     fuel:G.fuelSells||0,harvest:G.harvests||0});
function actRates(){
  const t=Math.max(45,G.time);
  return {merges:G.merges/t*60,builds:G.built/t*60,ships:G.shipsDocked/t*60};
}
function shipPeriod(){
  let p=Math.max(BAL.shipMin,BAL.shipEvery-G.stationTier*BAL.shipTierCut);
  if(mechIndex()===2)p/=1.2*mechPot()-(mechPot()-1);   // freight boom: sooner
  return p;
}
/* REACHABILITY PROOF. A goal that cannot be completed from the current board
   is a deadlock, and a deadlocked endless ladder is a dead game. Every candidate
   is checked against what the board can actually do right now: is there room to
   build, and is there a mergeable pair to free a slot? Passive kinds are always
   reachable, which is what keeps a fully-maxed board alive. */
function boardCanGrow(){
  const room=G.slots-G.mods.filter(Boolean).length;
  if(room>0)return true;
  let pair=false;
  G.mods.forEach((m,i)=>{if(!m||m.tier>=MAXTIER)return;
    G.mods.forEach((o,j)=>{if(j<=i||!o)return;if(o.tier===m.tier)pair=true;});});
  return pair;
}
function commissionCandidates(){
  const inc=Math.max(1,G.activeIncome||G.income), sess=G.time, done=G.commission||0;
  const ct=counters(), ar=actRates();
  const recent=G.recentKinds||[];
  // Target beat grows gently so the endless ladder never stalls or sprints.
  let beat = sess<120 ? 38 : sess<600 ? 48 : 78;
  if((G.awaySecs||0)>7200 && sess<90) beat=30;          // warm-up after a long absence
  const c=[];
  const add=(kind,delta,est,note)=>{ if(delta>0&&est>4&&est<600)
    c.push({kind,delta,est,note,recentPen:recent.slice(-3).includes(kind)?26:0}); };

  // BANK: N seconds of the player's own income -> always correctly scaled
  add('earned',Math.round(inc*beat/10)*10,beat,'bank credits');
  // DOCK: scaled to their real ship period
  add('ships',Math.max(3,Math.round(beat/shipPeriod()/2))*2,
      Math.max(3,Math.round(beat/shipPeriod()/2))*2*shipPeriod(),'dock ships');
  // MERGE: scaled to how fast THIS player actually merges (floor 4/min)
  const mRate=Math.max(4,ar.merges);
  if(boardCanGrow())add('merges',Math.max(2,Math.round(beat/60*mRate)),beat,'merge machines');
  // EXPAND: counted on G.built (monotonic) so merging never cancels progress
  const bRate=Math.max(2,ar.builds), canGrow=boardCanGrow();
  if(canGrow)add('built',Math.max(1,Math.round(beat/60*bRate)),beat,'install machines');
  // ASCEND: next tier, only while tiers remain and the board can still merge up
  if(ct.tier<MAXTIER&&boardCanGrow())add('tier',1,90+ct.tier*22,'reach the next machine tier');
  // HOLD: board-composition goal - a different KIND of want than a counter.
  // Target can never exceed the slot count or the goal is unwinnable.
  if(ct.tier>1&&ct.mods>1&&ct.mods<G.slots&&boardCanGrow())
    add('hold',Math.min(G.slots-ct.mods,3),70+ct.tier*14,'hold a stronger board');
  // DISPATCH: the Drydock's own verb. It is always reachable (the freighter
  // flies home from any business), so it can never strand a ladder.
  if(dispatchOn())add('dispatch',1,Math.max(beat,50),'send your freighter');
  // HOST: the Resort's verb; seating is always possible eventually, so it can
  // never strand a ladder
  if(guestsOn())add('host',2,beat,'check in guests');
  // CRACK: sell fuel into the price spikes; GROW: harvest the ripe window
  if(crackOn())add('fuel',2,beat,'sell fuel tanks');
  if(growOn())add('harvest',3,beat,'harvest ripe crops');
  // RUSH: time-boxed, only for long sessions that want spice, never back-to-back
  if(sess>300&&recent[recent.length-1]!=='rush')
    add('rush',Math.round(inc*38/10)*10,46,'rush: beat the clock');
  return {c,beat,inc,ct};
}
function scoreCommission(k,ctx){
  // "best for this player at this moment": closeness to the target beat,
  // variety, and affinity with how they have actually been playing.
  const ar=actRates();
  let s=-Math.abs(k.est-ctx.beat)*0.9 - k.recentPen;
  if(k.kind==='merges'&&ar.merges>ar.builds)s+=9;      // they like merging: give merges
  if(k.kind==='built'&&ar.builds>ar.merges)s+=9;       // they like building: give builds
  if(k.kind==='rush')s+= (G.time>600?6:-4);
  if(k.kind==='tier')s+=4;                             // progression reads as reward
  if(k.kind==='dispatch')s+=14;                        // in the Drydock, teach the verb first
  if(k.kind==='host')s+=14;                            // in the Resort, teach hosting first
  if(k.kind==='fuel')s+=14;                            // in the Refinery, teach the market
  if(k.kind==='harvest')s+=14;                         // in the Gardens, teach the window
  return s;
}
function issueCommission(){
  const ctx=commissionCandidates();
  if(!ctx.c.length){   // unreachable in practice: passive kinds always qualify
    const inc=Math.max(1,G.activeIncome||G.income);
    G.commissionGoal={kind:'earned',base:G.earned,v:G.earned+Math.round(inc*45/10)*10,
      r:Math.round(inc*45*0.85/10)*10,t:commissionText({kind:'earned',delta:Math.round(inc*45/10)*10}),
      rushSecs:0,deadline:0};
    return G.commissionGoal;
  }
  let best=ctx.c[0],bs=-1e9;
  ctx.c.forEach(k=>{const sc=scoreCommission(k,ctx);if(sc>bs){bs=sc;best=k;}});
  const base=counters()[best.kind==='rush'?'earned':best.kind]||0;
  const n=G.commission||0;
  const goal={
    kind:best.kind, base,
    v: best.kind==='tier'?  best.delta+ctx.ct.tier
       : best.kind==='hold'? Math.min(G.slots,ctx.ct.mods+best.delta)
       : base+best.delta,
    r: Math.max(20,Math.round(ctx.inc*best.est*0.85/10)*10)+n*Math.round(ctx.inc*2),
    t: commissionText(best),
    rushSecs: best.kind==='rush'?Math.round(best.est+14):0,
    deadline: best.kind==='rush'?G.time+Math.round(best.est+14):0
  };

}
function commissionText(k){

    case 'ships': return 'Dock '+k.delta+' cargo ships';
    case 'merges':return 'Merge '+k.delta+' machines';
    case 'built': return 'Install '+k.delta+' machines';
    case 'tier':  return 'Reach the '+TIER[Math.min(MAXTIER,k.v)-1].n+' (Tier '+Math.min(MAXTIER,k.v)+')';
    case 'hold':  return 'Hold '+k.v+' machines running at once';
    case 'rush':  return 'RUSH: bank '+fmt(k.delta)+' in '+Math.round(k.est+14)+'s';
    case 'dispatch':return 'Send your freighter on '+k.delta+' more route'+(k.delta>1?'s':'');
    case 'host':    return 'Check in '+k.delta+' guests at the Resort';
    case 'fuel':    return 'Sell '+k.delta+' fuel tanks at the Refinery';
    case 'harvest': return 'Harvest '+k.delta+' ripe crops';

}
function commissionProgress(){

  const cur=counters()[g.kind==='hold'?'mods':(g.kind==='rush'?'earned':g.kind)]||0;
  const span=Math.max(1,g.v-g.base);
  return {g,cur,pct:clamp((cur-g.base)/span,0,1),

function progress(){
  if(G.contract<CONTRACTS.length){
    const c=CONTRACTS[G.contract];
    const cur=counters()[c.k]||0;
    return {all:false,c,cur,pct:clamp(cur/c.v,0,1),showCur:cur,showV:c.v,
            header:'CONTRACT '+(G.contract+1)+' / '+CONTRACTS.length};
  }
  // Endless: the authored spine is complete; the board now posts commissions.
  if(!G.commissionGoal)issueCommission();
  const cp=commissionProgress();
  if(!cp)return {all:true,c:null,cur:0,pct:1};
  return {all:false,c:{t:cp.g.t,r:cp.g.r,v:cp.g.v,k:cp.g.kind},cur:cp.cur,pct:cp.pct,
          showCur:cp.showCur,showV:cp.showV,
          header:'COMMISSION '+(G.commission+1)+'  ·  '+ventureShort(G.activeV),
          rush:cp.g.deadline?Math.max(0,cp.g.deadline-G.time):0};

    // rad is capped so the module DISC (not just the orbit) stays on screen, and

  }else{

    // a fixed fraction pushed the top module up into the contract card.

function spawnShip(){
  const live=G.mods.map((m,i)=>m?i:-1).filter(i=>i>=0);
  if(!live.length)return;
  const tgt=live[(Math.random()*live.length)|0],tp=slotPos(tgt);
  const side=Math.random()<0.5?-1:1;
  const sx=UX+side*(FW*0.78),sy=L.hubY-280-Math.random()*180;

  const hx=L.hubX,hy=L.hubY,dx=tp.x-hx,dy=tp.y-hy,dl=Math.hypot(dx,dy)||1;

function tryBuild(){

/* --- THE GRAND BAZAAR: customer orders ----------------------------------
   A trader docks and asks for ONE specific machine tier. Tap the ticket and
   that machine is COMMITTED for a few seconds - it stops producing while the
   crate is packed - and you are paid a lump TIP worth far more than the down
   time. So selling is always profitable, but WHICH machine you commit and WHEN
   is a real choice, and a maxed board full of Tier 8s is worth more per ticket
   than a fresh one. Tickets are always drawn from machines that exist on your
   board, so an order can never be impossible, and letting one lapse costs
   nothing at all - it is missed upside, never punishment.
   This is the signature mechanic of the Bazaar: the reason Venture II plays
   differently from the Oreworks instead of merely wearing a different coat.
   It also pays you for WATCHING the screen, which is exactly what an active
   surface like YouTube Playables rewards - without ever gating progress. */
const ORDER_EVERY=16,ORDER_LIFE=28,ORDER_MAX=3,ORDER_BUSY=8,RELIEF_SECS=40;
/* DEMAND PRICING. Each tier's market price drifts on a slow random walk inside
   [0.75, 1.75]. A ticket pays the live price, so the Bazaar board's value MOVES
   - the same machines are worth more or less hour to hour, which is what makes
   a market a market and not a second idle screen. */
const DEMAND_EVERY=9,DEMAND_MIN=0.75,DEMAND_MAX=1.75;
function driftDemand(){
  if(!G.demand)G.demand=new Array(MAXTIER).fill(1);
  for(let i=0;i<2;i++){const t=(Math.random()*MAXTIER)|0;
    const d=G.demand[t]+(Math.random()*0.5-0.25);
    G.demand[t]=clamp(Math.round(d*100)/100,DEMAND_MIN,DEMAND_MAX);}
}
const demandOf=t=>(G.demand&&G.demand[t-1])||1;
/* A tip is quoted in SECONDS OF INCOME: 3s of what your WHOLE empire is making
   plus 10s of what the requested machine makes. Proportional, so a ticket in
   circuit three still feels like money - and because the empire funds it, the
   Bazaar stays the most lucrative place to STAND no matter how big you get.
   That is the point of a market: it is where you sell everything else you own.
   Attending it pays roughly +19% over idle, which is a real reward for watching
   the screen without ever being required to progress. */
const TIP_BOARD_S=3,TIP_MACHINE_S=10;
/* RELIEF ORDER - the anti-deadlock valve, and a real genre mechanic (Travel
   Town / Gossip Harbor use relief orders to clear clogged boards). When the
   board is FULL with no mergeable pair, nothing can build and nothing can
   merge: the classic merge-game dead end that stranded a real player at
   "install 17 machines, 14/17, ALL SLOTS FULL". A trader then offers to buy
   one machine outright - you lose the machine (a real cost, not a wipe) and
   gain a slot and credits. The board can never die. */
function spawnRelief(){
  const live=[];G.mods.forEach(m=>{if(m)live.push(m.tier);});
  if(!live.length)return;
  const tier=live[(Math.random()*live.length)|0];
  const tip=Math.max(10,Math.round(rate(tier)*RELIEF_SECS*demandOf(tier)*(G.sectorMult||1)));
  G.orders.push({tier:tier,t:ORDER_LIFE+8,life:ORDER_LIFE+8,tip:tip,leaving:0,relief:true,
    face:(Math.random()*4)|0,pop:0});
  G.reliefCd=45;
  toast('BOARD JAMMED \u2014 a trader will buy one machine to clear a slot',C.coral,0.3);
  Audio2.orderIn();
}
function spawnOrder(){
  const v=G.ventures&&G.ventures[G.activeV];
  if(v&&!v.orderHint){v.orderHint=true;
    toast('A TRADER WANTS ONE OF YOUR MACHINES \u2014 tap the ticket to sell it for a tip',C.goldLt,0.4);
    toast('It packs for a few seconds, then goes back to work. Selling always pays more than it costs.',C.dim,3.4);}
  const pool=[];G.mods.forEach(m=>{if(m&&!m.busy)pool.push(m.tier);});
  const tier=pool.length?pool[(Math.random()*pool.length)|0]:1;
  const pf=passiveOf(G.activeV||0);
  const board=(G.activeIncome||0)/(pf||1);          // the board's full potential
  const tip=Math.max(6,Math.round(((G.income||0)*TIP_BOARD_S+rate(tier)*TIP_MACHINE_S)
        *demandOf(tier)*(pf<1?1/pf:1)));            // a market venture lives on tips
  G.orders.push({tier:tier,t:ORDER_LIFE,life:ORDER_LIFE,tip:tip,leaving:0,
    face:(Math.random()*4)|0,pop:0});
  Audio2.orderIn();
}
function fillOrder(o){
  let best=null;
  if(o.relief){
    /* THE VALVE TAKES THE CHEAPEST MACHINE. A jam valve that eats your best
       machine is a tax dressed as help: selling the highest tier on every jam
       quietly destroys the compounding board (found by the 60-minute sim,
       where an attentive player ended an hour 30% BEHIND the player who
       ignored every ticket). Relief buys the least productive free machine. */
    G.mods.forEach(m=>{if(m&&!m.busy&&!m.hostT&&!m.crackT&&(!best||m.tier<best.tier))best=m;});
    if(!best){Audio2.deny();toast('No free machine to sell',C.coral);return false;}
  }else{
    G.mods.forEach(m=>{if(m&&!m.busy&&m.tier===o.tier&&(!best||m.tier>best.tier))best=m;});
    if(!best){Audio2.deny();toast('No free Tier '+o.tier+' machine \u2014 uncommit one or build it',C.coral);return false;}
  }
  if(o.relief){   // the machine is SOLD: gone for good, slot freed, credits paid
    G.mods[best.slot]=null;best=null;
    G.coins+=o.tip;G.earned+=o.tip;o.leaving=0.001;
    floatTxt(L.hubX,L.hubY-modRadius()*1.6,'SOLD  +'+fmt(o.tip),C.goldLt,21);
    toast('Machine sold \u2014 slot cleared',C.mint,0.6);
    Audio2.orderFill();recompute();layout();
    return true;
  }
  best.busy=ORDER_BUSY;best.busyMax=ORDER_BUSY;best.glow=1;
  G.coins+=o.tip;G.earned+=o.tip;
  o.leaving=0.001;
  floatTxt(best.x,best.y-modRadius()*1.35,'+'+fmt(o.tip)+'  TIP',C.goldLt,21);
  spawnCredStream(best.x,best.y-14,o.tip,C.goldLt);
  burstP(best.x,best.y,identOf(G.activeV||0).accent,14,150,0.6);
  ring(best.x,best.y,C.gold,86);
  G.credPulse=1;G.hubPulse=Math.max(G.hubPulse,0.5);
  if(o.daily)advanceStreak();               // the day's promise, kept
  Audio2.orderFill();recompute();
  return true;
}
/* SELF-HEALING GOALS. The per-player engine ranks the best goal for the board
   as it is NOW - so when the board changes under a posted goal (the player
   merged into a jam, sold into a hole), the goal is re-ranked and re-posted
   rather than left standing as a tombstone. A goal that cannot be completed is
   not a challenge, it is a bug with a caption. */
function goalReachable(g){
  if(!g)return false;
  const grow=boardCanGrow();
  switch(g.kind){
    case 'earned': case 'rush': return (G.income||0)>0||G.mods.some(Boolean);
    case 'ships':  return G.mods.some(Boolean);
    case 'merges': case 'built': return grow;
    case 'tier':   return grow&&G.stationTier<MAXTIER;
    case 'hold':   return grow&&G.mods.filter(Boolean).length>1&&G.mods.filter(Boolean).length<G.slots;
    default:       return true;
  }
}
function healCommission(){
  if(G.scene!=='play'||G.contract<CONTRACTS.length)return;
  if(G.commissionGoal&&!goalReachable(G.commissionGoal)){
    G.commissionGoal=null;issueCommission();
    toast('COMMISSION REVISED \u2014 the board changed under it',C.dim,0.2);
    Audio2.ui();
  }
}
function updateOrders(dt){
  const market=ordersOn();
  /* market tickets belong to the market; relief traders belong to the EMPIRE.
     A clogged board must be able to breathe in EVERY act, or the promise on
     the jam bar ("a relief trader will offer to buy a machine") is a lie in
     five acts out of six. Found the hard way: a player screenshot of a jammed
     Fuel Refinery with the valve message up and no ticket ever arriving. */
  if(!market&&G.orders&&G.orders.length)G.orders=G.orders.filter(o=>o.relief||o.daily||o.golden);
  G.reliefCd=Math.max(0,(G.reliefCd||0)-dt);
  // the jam valve: full board, no mergeable pair, no relief already docked
  if(!boardCanGrow()&&G.reliefCd<=0&&!G.orders.some(o=>o.relief&&!o.leaving))spawnRelief();
  if(market){
    G.demandT=(G.demandT||0)-dt;
    if(G.demandT<=0){G.demandT=DEMAND_EVERY;driftDemand();}
    G.orderT=(G.orderT||0)-dt;
    if(G.orders.length<ORDER_MAX&&G.orderT<=0){G.orderT=ORDER_EVERY;spawnOrder();}
  }
  for(let i=G.orders.length-1;i>=0;i--){const o=G.orders[i];
    if(o.leaving>0){o.leaving+=dt;if(o.leaving>0.7)G.orders.splice(i,1);continue;}
    o.t-=dt;o.pop=Math.max(0,(o.pop||0)-dt*3);
    if(o.t<=0){o.leaving=0.001;Audio2.orderGone();}}
  let dirty=false;                        // commit timers on packing machines

/* =====================================================================
   7d. DISPATCH — the Drydock's signature verb
   ===================================================================== */
/* Act III must bring a NEW PURPOSE, not a new coefficient. Dispatch is a
   decision with a clock on it: spend credits now, pick a route, and YOUR OWN
   freighter comes back later worth more. The long runs outlast a session, so
   the ship docks while the player is away and is waiting when they return -
   the check-back appointment that the platform's most-played tycoons are built

   Longer lock-up pays a better multiple, so the choice is real: cash flow now

const ROUTES=[
  {n:'COASTAL',  dur:45, cost:20, pay:2.0},
  {n:'DEEP LANE',dur:150,cost:60, pay:2.6},
  {n:'RIM RUN',  dur:420,cost:180,pay:3.4}

     waits on a 7-minute flight clock stalls the whole commission ladder and,
     with it, the gate to the next act. The haul stays the reward for deciding. */

  toast('+'+fmt(G.freight.pay)+' on docking',C.gold,2.2);
  ring(L.hubX,L.hubY,identOf(G.activeV).accent,210);

/* =====================================================================
   7e. GUESTS — the Resort's signature verb
   ===================================================================== */
/* Act IV must be a different KIND of evening, not a louder multiplier. In the
   Resort, travellers dock with a request - a suite of one exact tier - and you
   check them in by tapping their card. Their suite is that machine: it stops
   producing cargo and instead pays a guest rate every second they stay, plus a
   checkout bonus when they leave. Two suites occupied at once is a party and
   pays +25% on both, so the verb is capacity planning: who do you seat now,

const GUEST_EVERY=13, GUEST_MAX=3, GUEST_LIFE=26;

function spawnGuest(){
  const pool=[];G.mods.forEach(m=>{if(m)pool.push(m.tier);});

  const stay=18+((Math.random()*14)|0);

  best.hostT=g.stay;best.hostStay=g.stay;best.hostPay=g.pay;best.glow=1;

  G.partyToast=Math.max(0,(G.partyToast||0)-dt);

    G.guestT=(G.guestT||GUEST_EVERY*0.4)-dt;
    if(G.guestT<=0){G.guestT=GUEST_EVERY;if(G.guests.length<GUEST_MAX)spawnGuest();}
    for(let i=G.guests.length-1;i>=0;i--){const g=G.guests[i];
      if(g.leaving>0){g.leaving+=dt;if(g.leaving>0.7)G.guests.splice(i,1);continue;}
      g.t-=dt;g.pop=Math.max(0,g.pop-dt*3);
      if(g.t<=0){g.leaving=0.001;Audio2.orderGone();}}
  }
}
function drawGuests(){
  if(!G.guests||!G.guests.length)return;
  const rs=orderRects(),off=G.orders?G.orders.length:0;
  const I=identOf(G.activeV||0),A=I.accent;

  G.guests.forEach((g,i)=>{

    drawPanel(r.x,r.y,r.w,r.h,r.h*0.24,'rgba(14,8,26,0.92)',withAlpha(col,0.85));

    ctx.fillStyle='rgba(6,9,20,0.85)';rr(ctx,sx-r.h*0.19,sy+r.h*0.13,r.h*0.38,Math.max(9,r.h*0.16),4);ctx.fill();

    ctx.fillStyle=C.dim;ctx.font=f(700,Math.max(9,r.h*0.16));

    ctx.restore();
  });
  ctx.textBaseline='alphabetic';

/* =====================================================================
   7f. CRACK — the Refinery's verb: a pipeline and three tanks
   ===================================================================== */
/* Act V is not merge-with-a-bonus: it is a SMALL MARKET YOU PLUMB. Tapping a
   machine cracks its cargo into fuel for 6 seconds - the machine hauls nothing
   while it cracks - and the fuel flows into one of three tanks by tier band.
   Each tank has its own live price that drifts faster and wider than the
   Bazaar's demand. Tapping a tank sells everything in it at THAT moment's
   price; selling a >=90% full tank pays a +25% volume bonus. So the verb is
   push-your-luck market timing: sell into a spike now, or hold for a fatter
   tank and watch the price fall. A full tank blocks cracking, so hoarding has
   a real cost. Nothing here can fail - a bad sale is a lesson, not a loss. */
const CRACK_TIME=6, TANK_CAP=30, TANK_FULL_BONUS=1.25, CRACK_RATE=1.1;
const TANK_BANDS=[[1,3],[4,6],[7,8]];
const crackOn=()=>!!identOf(G.activeV||0).crack;
const tankOf=tier=>tier<=3?0:tier<=6?1:2;
function tanksInit(){if(!G.tanks)G.tanks=TANK_BANDS.map(()=>({v:0,fill:0,d:1,t:0}));return G.tanks;}
function startCrack(m){
  const tk=tanksInit()[tankOf(m.tier)];
  if(tk.fill>=TANK_CAP){toast('TANK '+(tankOf(m.tier)+1)+' IS FULL \u2014 sell it first',C.coral);Audio2.deny();return false;}
  m.crackT=CRACK_TIME;m.glow=1;
  toast('CRACKING T'+m.tier+' \u2192 TANK '+(tankOf(m.tier)+1),identOf(G.activeV).accent,0.1);
  Audio2.ui();recompute();return true;
}
function sellTank(i){
  const tk=tanksInit()[i];if(!tk||tk.v<=0){Audio2.deny();return false;}
  const full=tk.fill>=TANK_CAP*0.9;
  const pay=Math.round(tk.v*tk.d*(full?TANK_FULL_BONUS:1));
  G.coins+=pay;G.earned+=pay;G.fuelSells=(G.fuelSells||0)+1;
  toast('FUEL SOLD  +'+fmt(pay)+'   \u00D7'+tk.d.toFixed(2)+(full?'  FULL BONUS':''),C.gold);
  floatTxt(L.hubX,L.hubY-64,'+'+fmt(pay),C.gold,26);
  burstP(L.hubX,L.hubY,C.gold,26,230,0.9);ring(L.hubX,L.hubY,identOf(G.activeV).accent,190);
  tk.v=0;tk.fill=0;Audio2.contract();saveGame();return pay;
}
function updateCrack(dt){
  const on=crackOn(),TK=tanksInit();
  G.mods.forEach(m=>{
    if(!m||!m.crackT)return;
    m.crackT-=dt;
    const tk=TK[tankOf(m.tier)];
    if(tk.fill<TANK_CAP){
      tk.v+=rate(m.tier)*CRACK_RATE*(G.sectorMult||1)*dt;
      tk.fill=Math.min(TANK_CAP,tk.fill+dt);
    }
    if(m.crackT<=0||tk.fill>=TANK_CAP){
      m.crackT=0;
      if(tk.fill>=TANK_CAP&&!m.fullToast){m.fullToast=1;
        toast('TANK '+(tankOf(m.tier)+1)+' FULL \u2014 tap it to sell',C.goldLt,0.2);}
      recompute();
    }
  });
  G.mods.forEach(m=>{if(m&&m.fullToast&&(!m.crackT))m.fullToast=Math.max(0,m.fullToast-dt);});
  if(on){TK.forEach(tk=>{tk.t=(tk.t||0)-dt;
    if(tk.t<=0){tk.t=DEMAND_EVERY*0.5;
      tk.d=clamp(tk.d+(Math.random()-0.5)*0.34,0.6,2.0);}});}
}
function tankRects(){
  if(!crackOn()||!L.ord)return [];
  const O=L.ord,field=O.field||(FW-16),n=3;
  const w=clamp((field-(n-1)*O.gap)/n,54,140),out=[];
  for(let i=0;i<n;i++)out.push({x:O.x0+i*(w+O.gap),y:O.y0,w:w,h:O.h});
  return out;
}
function hitTank(x,y){
  if(!crackOn())return -1;
  const rs=tankRects();
  for(let i=0;i<rs.length;i++){const r=rs[i];if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return i;}
  return -1;
}
function drawTanks(){
  if(!crackOn())return;
  const rs=tankRects();if(!rs.length)return;
  const TK=tanksInit(),A=identOf(G.activeV).accent;
  /* TANK CARDS: a vertical gauge of fuel, the live price chip, and the stored
     value. The gauge IS the push-your-luck clock; the chip IS the market. */
  rs.forEach((r,i)=>{
    const tk=TK[i],full=tk.fill>=TANK_CAP*0.9,empty=tk.v<=0;
    const col=full?C.gold:(empty?'#5A6480':A);
    drawPanel(r.x,r.y,r.w,r.h,r.h*0.24,'rgba(10,12,4,0.92)',withAlpha(col,0.85));
    const gx=r.x+r.h*0.30,gy=r.y+r.h*0.16,gw=r.h*0.34,gh=r.h*0.68;
    ctx.fillStyle='rgba(0,0,0,0.45)';rr(ctx,gx,gy,gw,gh,5);ctx.fill();
    const fr=clamp(tk.fill/TANK_CAP,0,1);
    if(fr>0){
      const lg=ctx.createLinearGradient(0,gy+gh,0,gy);
      lg.addColorStop(0,'#7A4A0C');lg.addColorStop(1,C.goldLt);
      ctx.fillStyle=lg;rr(ctx,gx+2,gy+gh-(gh-4)*fr,gw-4,(gh-4)*fr,4);ctx.fill();
      ctx.fillStyle=withAlpha('#FFFFFF',0.25);
      ctx.fillRect(gx+2,gy+gh-(gh-4)*fr,gw-4,2);
    }
    ctx.strokeStyle=withAlpha(col,0.9);ctx.lineWidth=1.6;rr(ctx,gx,gy,gw,gh,5);ctx.stroke();
    ctx.fillStyle=withAlpha('#000',0.5);
    ctx.beginPath();ctx.moveTo(gx,gy+gh*0.1);ctx.lineTo(gx+gw,gy+gh*0.1);ctx.stroke();
    const px=gx+gw+r.h*0.16;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillStyle=withAlpha(col,0.95);ctx.font=f(800,Math.max(9,r.h*0.16));
    ctx.fillText('TANK '+(i+1)+'  T'+TANK_BANDS[i][0]+'\u2013'+TANK_BANDS[i][1],px,r.y+r.h*0.22);
    const hot=tk.d>1.08,cold=tk.d<0.92;
    ctx.fillStyle=hot?withAlpha(C.gold,0.22):(cold?withAlpha('#8C99BE',0.18):withAlpha('#8C99BE',0.12));
    const dw=Math.max(30,r.h*0.5),dh=Math.max(12,r.h*0.2);
    rr(ctx,px,r.y+r.h*0.36,dw,dh,dh/2);ctx.fill();
    ctx.textAlign='center';
    ctx.fillStyle=hot?C.goldLt:(cold?C.dim:C.paper);ctx.font=f(800,Math.max(9,r.h*0.16));
    ctx.fillText('\u00D7'+tk.d.toFixed(2),px+dw/2,r.y+r.h*0.36+dh/2+0.5);
    ctx.textAlign='left';
    drawCoin(px+6,r.y+r.h*0.70,Math.max(5,r.h*0.09),1);
    ctx.fillStyle=empty?C.dim:C.gold;ctx.font=f(800,Math.max(12,r.h*0.23));
    ctx.fillText(fmt(Math.round(tk.v*(full?TANK_FULL_BONUS:1))),px+14,r.y+r.h*0.70);
    if(full){
      ctx.fillStyle=C.goldLt;ctx.font=f(800,Math.max(9,r.h*0.15));
      ctx.fillText('FULL \u00B7 TAP',px,r.y+r.h*0.90);
    }
  });
  ctx.textBaseline='alphabetic';
}

/* =====================================================================
   7g. GROW — the Gardens' verb: plant, ripen, harvest, compost
   ===================================================================== */
/* Act VI makes TIME and NEIGHBOURS the gameplay. Planting a crop diverts half
   a machine's cargo while it grows; it ripens into a glowing ten-second window
   (harvest = a big burst); miss the window and it composts - no payout, but the
   neighbouring machines grow and earn +15% for half a minute. Two ripe crops
   side by side pollinate: +25% on both harvests. So the board becomes a garden
   you plan: what do you take out of service, when do you look up, and where do
   you let something rot on purpose to feed its neighbours. */
const GROW=20, RIPE_WIN=10, HARVEST_SECS=8, COMPOST_SECS=30, COMPOST_MUL=1.15, POLLI_MUL=1.25;
const growOn=()=>!!identOf(G.activeV||0).grow;
const neighboursOf=m=>{const out=[];G.mods.forEach((o,i)=>{
  if(!o||o===m)return;if(Math.abs(i-m.slot)===1||Math.abs(i-m.slot)===G.slots-1)out.push(o);});return out;};
function plantCrop(m){
  m.crop={t:0,ripe:false,over:false,ripeT:0};m.glow=0.6;
  toast('PLANTED T'+m.tier+' \u2014 harvest when it glows',identOf(G.activeV).accent,0.1);
  Audio2.ui();recompute();return true;
}
function harvestCrop(m){
  const pol=neighboursOf(m).some(o=>o.crop&&o.crop.ripe&&!o.crop.over);
  const pay=Math.round(rate(m.tier)*(G.sectorMult||1)*HARVEST_SECS*(pol?POLLI_MUL:1));
  G.coins+=pay;G.earned+=pay;G.harvests=(G.harvests||0)+1;
  floatTxt(m.x,m.y-44,'HARVEST  +'+fmt(pay)+(pol?'  \u00D71.25':''),C.mint,22);
  burstP(m.x,m.y,C.mint,18,170,0.7);ring(m.x,m.y,C.mint,80);
  m.crop=null;m.glow=1;Audio2.contract();recompute();return pay;
}
function updateGrow(dt){
  if(!G.mods.some(m=>m&&(m.crop||m.compostT)))return;
  G.mods.forEach(m=>{
    if(!m)return;
    if(m.compostT)m.compostT=Math.max(0,m.compostT-dt);
    if(!m.crop)return;
    const c=m.crop;
    if(!c.ripe){
      c.t+=dt*(1+(m.compostT>0?0.15:0));
      if(c.t>=GROW){c.ripe=true;c.ripeT=0;ring(m.x,m.y,C.mint,70);Audio2.orderIn();}
    }else{
      c.ripeT+=dt;
      if(c.ripeT>RIPE_WIN){
        c.over=true;m.crop=null;m.compostT=COMPOST_SECS;
        neighboursOf(m).forEach(o=>{o.compostT=Math.max(o.compostT||0,COMPOST_SECS);});
        burstP(m.x,m.y,'#7A5A2C',14,120,0.6);
        toast('COMPOSTED \u2014 neighbours grow and earn +15% for 30s','#B8F04A',0.2);
        recompute();
      }
    }
  });
}
function drawCrop(m,R){
  const c=m.crop;
  if(m.compostT&&!c){
    ctx.save();ctx.globalAlpha=0.5*clamp(m.compostT/COMPOST_SECS,0,1);
    ctx.strokeStyle='#B8F04A';ctx.lineWidth=2;ctx.setLineDash([4,5]);
    ctx.beginPath();ctx.arc(m.x,m.y,R*1.5,G.time,G.time+TAU);ctx.stroke();ctx.setLineDash([]);
    ctx.restore();return;
  }
  if(!c)return;
  const st=c.ripe?3:(c.t>GROW*0.66?2:(c.t>GROW*0.33?1:0));
  ctx.save();ctx.translate(m.x,m.y-R*0.95);
  if(c.ripe){
    const pu=0.6+0.4*Math.sin(G.time*6);
    ctx.save();ctx.globalCompositeOperation='lighter';
    const gl=ctx.createRadialGradient(0,0,0,0,0,R*1.5);
    gl.addColorStop(0,withAlpha(C.mint,0.35*pu));gl.addColorStop(1,withAlpha(C.mint,0));
    ctx.fillStyle=gl;ctx.beginPath();ctx.arc(0,0,R*1.5,0,TAU);ctx.fill();ctx.restore();
    const fr=clamp(1-c.ripeT/RIPE_WIN,0,1);
    ctx.strokeStyle=fr<0.35?C.coral:C.mint;ctx.lineWidth=2.4;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,R*1.25,-Math.PI/2,-Math.PI/2+TAU*fr);ctx.stroke();
  }
  ctx.strokeStyle='#3E7A34';ctx.lineWidth=Math.max(2,R*0.12);ctx.lineCap='round';
  const hgt=R*(0.35+st*0.3);
  ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(R*0.12,-hgt*0.6,0,-hgt);ctx.stroke();
  if(st>=1){ctx.fillStyle='#4E9A3C';
    ctx.beginPath();ctx.ellipse(-R*0.26,-hgt*0.5,R*0.26,R*0.13,-0.6,0,TAU);ctx.fill();
    ctx.beginPath();ctx.ellipse(R*0.26,-hgt*0.66,R*0.26,R*0.13,0.6,0,TAU);ctx.fill();}
  if(st>=2){ctx.fillStyle='#6EC24C';
    ctx.beginPath();ctx.ellipse(-R*0.3,-hgt*0.85,R*0.3,R*0.15,-0.5,0,TAU);ctx.fill();}
  if(st===3){ctx.fillStyle=C.coral;
    ctx.beginPath();ctx.arc(0,-hgt-R*0.16,R*0.24,0,TAU);ctx.fill();
    ctx.fillStyle=withAlpha('#FFFFFF',0.5);
    ctx.beginPath();ctx.arc(-R*0.07,-hgt-R*0.23,R*0.08,0,TAU);ctx.fill();}
  ctx.restore();
}

function completeCommission(){
  const g=G.commissionGoal;if(!g)return;
  G.coins+=g.r;G.earned+=g.r;G.commission=(G.commission||0)+1;
  Audio2.contract();TUT.hit('contract');
  toast('COMMISSION COMPLETE   +'+fmt(g.r),C.gold);
  burstP(L.hubX,L.hubY,C.gold,34,280,1.0);ring(L.hubX,L.hubY,C.gold,220);
  G.shake=Math.max(G.shake,8);G.flash=Math.max(G.flash,0.2);G.stationGlow=1;
  /* SLOTS COME FROM THE LADDER TOO. The authored spine unlocks build slots via
     contracts 1-14 - which means a venture opened AFTER the spine would be
     frozen at 4 slots forever, a crippled board next to a maxed one. Found by
     the 60-minute franchise sim: the promoted Oreworks paid 468/s away while
     the Bazaar board it had been playing for 45 minutes made 35/s. Every second
     commission now unlocks a slot, so each venture gets its own growth arc and
     the escalating gate is worth climbing. Authored contracts are untouched. */
  const v=G.ventures&&G.ventures[G.activeV];
  if(v&&G.commission%2===0&&G.slots<MAXSLOTS){
    G.slots++;v.slots=G.slots;layout();
    toast('NEW BUILD SLOT UNLOCKED  ('+G.slots+'/'+MAXSLOTS+')',C.mint,0.45);
    Audio2.fanfare();
  }
  syncActive();      // keep the business record as fresh as the live ladder
  // The charter presents itself once. If the player waved it off, it stays one
  // tap away on the HUD chip, and re-offers after a while rather than hiding.
  if(charterReady()){
    const cv=G.ventures[G.activeV];
    if(!cv.charterSeen)cv.charterSeen='pending';
    else if(cv.charterSeen===true){cv.nag=(cv.nag||0)+1;
      if(cv.nag>=4){cv.nag=0;cv.charterSeen='pending';}}
  }
  issueCommission();
  saveGame();
}

/* =====================================================================
   8c. THE RETURN HOOK — offline earnings + a per-moment greeting.
   A finished station must be an ASSET, not a tombstone: it keeps working
   while the player is gone (half rate, capped), and the moment they come
   back they are met with the pile first and then the single best next goal
   ranked for their station right now. Order is deliberate: reward, then
   direction.
   ===================================================================== */
function offlinePile(r){
  if(!r||!r.savedAt)return null;
  const away=Math.max(0,(Date.now()-r.savedAt)/1000);
  if(away<60)return null;
  const inc=r.income||0;if(inc<=0)return null;
  const secs=Math.min(away,OFF_CAP_H*3600);
  const amount=Math.floor(inc*OFF_EFF*secs);
  if(amount<1)return null;
  return {amount,away,secs,rate:inc*OFF_EFF};
}
function fmtDur(secs){
  const h=Math.floor(secs/3600),m=Math.floor((secs%3600)/60);
  if(h&&m)return h+'h '+m+'m';
  if(h)return h+'h';
  if(m)return m+'m';
  return Math.floor(secs)+'s';
}
function drawReturnPile(){
  const p=G.pendingPile;if(!p){G.scene='returngoal';return;}
  ctx.fillStyle='rgba(3,5,14,0.88)';ctx.fillRect(0,0,FW,FH);
  OVERLAY_BTNS=[];
  const bw=Math.min(360,FW-56),bx=UX-bw/2,bh=250,by=FH*0.5-bh/2;
  drawPanel(bx,by,bw,bh,22,'rgba(12,17,38,0.97)',withAlpha(C.gold,0.9));
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=C.gold;ctx.font=f(800,15);
  ctx.fillText('WHILE YOU WERE AWAY',UX,by+34);
  ctx.fillStyle=C.dim;ctx.font=f(600,15);
  ctx.fillText('Your station kept working for '+fmtDur(p.away),UX,by+62);
  ctx.fillStyle=C.faint;ctx.font=f(600,13);
  ctx.fillText('offline rate '+Math.round(OFF_EFF*100)+'%  ·  capped at '+OFF_CAP_H+'h',UX,by+84);
  drawCoin(UX,by+126,26,1+Math.sin(G.time*2.2)*0.05);
  ctx.fillStyle=C.goldLt;ctx.font=f(800,40);
  ctx.shadowColor=withAlpha(C.gold,0.6);ctx.shadowBlur=22;
  ctx.fillText('+'+fmt(p.amount),UX,by+176);ctx.shadowBlur=0;
  const btnY=by+bh-64,btnH=52;
  const hot=ptr.down&&inRect(ptr,bx+24,btnY,bw-48,btnH);
  drawButton(bx+24,btnY,bw-48,btnH,'COLLECT',null,true,hot);
  OVERLAY_BTNS.push({x:bx+24,y:btnY,w:bw-48,h:btnH,fn:collectPile});
}
function collectPile(){
  const p=G.pendingPile;if(!p)return;
  G.coins+=p.amount;G.earned+=p.amount;G.pendingPile=null;
  burstP(UX,FH*0.5,C.gold,40,300,1.0);ring(UX,FH*0.5,C.gold,240);
  G.shake=Math.max(G.shake,6);Audio2.contract();
  saveGame();
  G.scene='returngoal';
}
function drawReturnGoal(){
  const pr=progress();
  ctx.fillStyle='rgba(3,5,14,0.88)';ctx.fillRect(0,0,FW,FH);
  OVERLAY_BTNS=[];
  const bw=Math.min(360,FW-56),bx=UX-bw/2,bh=244,by=FH*0.5-bh/2;
  drawPanel(bx,by,bw,bh,22,'rgba(12,17,38,0.97)',withAlpha(C.mint,0.85));
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle=C.mint;ctx.font=f(800,15);
  ctx.fillText(G.contract>=CONTRACTS.length?'YOUR BEST NEXT MOVE':'YOUR CURRENT CONTRACT',UX,by+32);
  ctx.fillStyle=C.faint;ctx.font=f(600,12.5);
  ctx.fillText(G.contract>=CONTRACTS.length
    ?'ranked for your station, right now'
    :pr.header,UX,by+54);
  ctx.fillStyle=C.paper;ctx.font=f(700,21);
  wrapCentred(pr.all?'Keep building. Chase the record.':pr.c.t,UX,by+92,bw-52,27);
  if(!pr.all){ctx.fillStyle=C.gold;ctx.font=f(800,15);
    ctx.fillText('REWARD  +'+fmt(pr.c.r),UX,by+138);}
  const stk=streakState();
  ctx.fillStyle=C.faint;ctx.font=f(600,12);
  ctx.fillText(stk.n>=1&&stk.day===dayKey()
    ?'STREAK DAY '+stk.n+' BANKED  \u00B7  tomorrow\u2019s contract pays more'
    :(stk.n?'STREAK DAY '+stk.n+' AT RISK  \u00B7  today\u2019s golden contract is docked'
           :'A golden DAILY CONTRACT is docked  \u00B7  fulfil it to start a streak'),UX,by+164);
  const btnY=by+bh-58,btnH=50;
  const hot=ptr.down&&inRect(ptr,bx+24,btnY,bw-48,btnH);
  drawButton(bx+24,btnY,bw-48,btnH,'TO THE STATION',null,true,hot);
  OVERLAY_BTNS.push({x:bx+24,y:btnY,w:bw-48,h:btnH,fn:()=>{Platform.clearPaused();G.scene='play';Audio2.ui();}});
}
function wrapCentred(txt,cx,y,maxW,lh){
  const words=txt.split(' ');let line='',yy=y;
  for(const w of words){const t=line?line+' '+w:w;
    if(ctx.measureText(t).width>maxW&&line){ctx.fillText(line,cx,yy);yy+=lh;line=w;}else line=t;}
  if(line)ctx.fillText(line,cx,yy);
}

/* ---------------------------------------------------------------------
   PERSISTENCE — Playgama: "Player retention relies on saving progress.
   Your saves must work correctly." Autosaves every 5s and on every
   meaningful event, so closing the tab can never cost a run.
   --------------------------------------------------------------------- */
function saveGame(){
  try{
    Platform.save('best',Math.max(G.best,G.earned));
    Platform.save('run',{
      coins:G.coins,earned:G.earned,mods:G.mods.map(m=>m?m.tier:0),slots:G.slots,
      built:G.built,merges:G.merges,shipsDocked:G.shipsDocked,contract:G.contract,
      freight:G.freight?{...G.freight}:null,dispatches:G.dispatches||0,sent:G.sent||0,
      hosted:G.hosted||0,
      fuelSells:G.fuelSells||0,harvests:G.harvests||0,
      streak:G.streak?{n:G.streak.n,day:G.streak.day,best:G.streak.best,
        freezes:G.streak.freezes,tokens:G.streak.tokens}:null,
      eventsSeen:G.eventsSeen||0,
      tanks:(G.tanks||[]).map(t=>({v:Math.round(t.v),fill:t.fill,d:t.d})),
      endless:G.endless,time:G.time,savedAt:Date.now(),income:G.income,
      sectorMult:G.sectorMult,activeV:G.activeV,
      ventures:(syncActive(),G.ventures)
    });
  }catch(e){}
}
function loadGame(){
  try{
    const r=Platform.load('run',null);
    if(!r||!(Array.isArray(r.mods)||Array.isArray(r.ventures)))return false;
    G.coins=r.coins||0;G.earned=r.earned||0;G.best=Math.max(G.best,r.earned||0);
    G.built=r.built||0;G.merges=r.merges||0;G.shipsDocked=r.shipsDocked||0;
    G.contract=clamp(r.contract||0,0,CONTRACTS.length);
    G.endless=!!r.endless;G.time=r.time||0;
    G.dispatches=r.dispatches||0;G.sent=r.sent||r.dispatches||0;
    G.dockedWhileAway=0;G.hosted=r.hosted||0;
    G.fuelSells=r.fuelSells||0;G.harvests=r.harvests||0;
    /* the daily rhythm migrates: a save from before it existed simply starts
       its streak with today's contract - nothing is lost or reset. */
    G.streak=(r.streak&&typeof r.streak==='object')
      ?Object.assign(streakInit(),r.streak,
          {tokens:Object.assign(streakInit().tokens,r.streak.tokens||{})})
      :streakInit();
    G.eventsSeen=r.eventsSeen||0;G.event=null;G.eventT=EVENT_FIRST;
    resolveStreakGap();
    G.tanks=Array.isArray(r.tanks)&&r.tanks.length===3?r.tanks.map(t=>({
      v:t.v||0,fill:t.fill||0,d:t.d||1,t:0})):null;
    G.freight=(r.freight&&typeof r.freight.dur==='number')?{
      i:clamp(r.freight.i||0,0,ROUTES.length-1),cost:r.freight.cost||0,
      pay:r.freight.pay||0,t:r.freight.t||0,dur:r.freight.dur,wall:r.freight.wall||Date.now()}:null;
    /* the freighter keeps flying while the game is closed: if it came home
       during the absence it is paid the moment the save loads, and the player
       is told on whichever screen they land on. */
    if(G.freight){
      const awayMs=Date.now()-(G.freight.wall||Date.now());
      if(awayMs>=G.freight.dur*1000){
        G.dockedWhileAway=G.freight.pay;G.coins+=G.freight.pay;G.earned+=G.freight.pay;
        G.dispatches++;G.freight=null;
      }
    }
    G.sectorMult=r.sectorMult||1;
    G.slots=clamp(r.slots||STARTSLOTS,STARTSLOTS,MAXSLOTS);
    G.stationTier=r.stationTier||1;
    G.mods=new Array(MAXSLOTS).fill(null);
    (Array.isArray(r.mods)?r.mods:[]).forEach((t,sl)=>{
      if(sl<MAXSLOTS&&t>=1&&t<=MAXTIER)G.mods[sl]=mkMod(sl,t);});
    if(Array.isArray(r.ventures)&&r.ventures.length){
      G.ventures=r.ventures.map(v=>{
        v.dividend=v.dividend!=null?v.dividend:(v.income||0);  // pre-morph saves
        v.ident=v.ident||identOf(v.k||0).key;v.recentKinds=v.recentKinds||[];
        delete v.mods;delete v.slots;delete v.stationTier;     // one shared board
        return v;});
      G.activeV=clamp(r.activeV||0,0,G.ventures.length-1);
    }else{
      /* MIGRATION from the pre-franchise shape (sector N + outposts). Every
         promoted board becomes a business record; nothing is dropped. */
      const n=Math.max(1,r.sector||1),vents=[];
      (r.outposts||[]).forEach((o,i)=>{const v=mkVenture(i);
        v.dividend=Math.round((o.income||0)/OUTPOST_EFF);
        v.charterTaken=true;v.charterSeen=true;vents.push(v);});
      const act=mkVenture(n-1);
      act.commission=r.commission||0;act.commissionGoal=r.commissionGoal||null;
      act.recentKinds=r.recentKinds||[];
      vents.push(act);
      G.ventures=vents;G.activeV=vents.length-1;
    }
    loadActive(G.activeV);
    if(!G.mods.some(Boolean)){G.mods[0]=mkMod(0,1);G.mods[1]=mkMod(1,1);recompute();}
    if(G.commissionGoal&&!goalReachable(G.commissionGoal)){G.commissionGoal=null;issueCommission();}
    return G.earned>0||G.merges>0;
  }catch(e){return false;}
}

/* =====================================================================
   9. INPUT — one unified pointer path for mouse, touch and pen
   ===================================================================== */
let ptr={x:0,y:0,down:false};
function toDesign(e){
  const r=cvs.getBoundingClientRect();
  return {x:(e.clientX-r.left)/S,y:(e.clientY-r.top)/S};
}
const inRect=(p,x,y,w,h)=>p.x>=x&&p.x<=x+w&&p.y>=y&&p.y<=y+h;
let BUILD_BTN={x:0,y:0,w:0,h:0},CLONE_BTN=null,ICON_PAUSE={x:0,y:0,r:0},ICON_SOUND={x:0,y:0,r:0},ICON_STREAK={x:0,y:0,r:0},OVERLAY_BTNS=[],FRANCHISE_BTN=null;

function onDown(e){
  if(e.pointerId!==undefined){try{cvs.setPointerCapture(e.pointerId);}catch(err){}}
  Audio2.unlock();
  const p=toDesign(e);ptr={x:p.x,y:p.y,down:true};
  if(G.scene==='title'){
    Audio2.unlock();
    if(G.hasSave){
      for(const b of OVERLAY_BTNS) if(inRect(p,b.x,b.y,b.w,b.h)){Audio2.ui();b.fn();
        if(!G.readySent){Platform.gameReady();G.readySent=true;} return;}
      continueGame(); // tapping anywhere else resumes — never a dead end
    } else beginFromTitle();
    if(!G.readySent){Platform.gameReady();G.readySent=true;}
    return;
  }
  if(G.scene==='travel')return;
  if(G.scene==='paused'||G.scene==='done'||G.scene==='return'||G.scene==='returngoal'||G.scene==='sector'||G.scene==='switch'||G.scene==='streak'){
    for(const b of OVERLAY_BTNS)if(inRect(p,b.x,b.y,b.w,b.h)){Audio2.ui();b.fn();return;}
    return;
  }
  if(TUT.active&&TUT.skipBtn&&inRect(p,TUT.skipBtn.x,TUT.skipBtn.y,TUT.skipBtn.w,TUT.skipBtn.h)){
    TUT.stop();Audio2.ui();return;}
  // On the final step a tap anywhere dismisses it - the standard coach-mark exit.
  if(TUT.active&&TUT.isLast()&&TUT.t>0.6){TUT.stop();Audio2.ui();}
  if(Math.hypot(p.x-ICON_STREAK.x,p.y-ICON_STREAK.y)<ICON_STREAK.r){openStreak();return;}
  if(Math.hypot(p.x-ICON_PAUSE.x,p.y-ICON_PAUSE.y)<ICON_PAUSE.r){pauseGame();return;}
  if(Math.hypot(p.x-ICON_SOUND.x,p.y-ICON_SOUND.y)<ICON_SOUND.r){
    Audio2.setMuted(!Audio2.isMuted());Platform.setAudioEnabled(!Audio2.isMuted());Audio2.ui();return;}
  if(FRANCHISE_BTN&&inRect(p,FRANCHISE_BTN.x,FRANCHISE_BTN.y,FRANCHISE_BTN.w,FRANCHISE_BTN.h)){chipAction();return;}
  const ti=hitTank(p.x,p.y);
  if(ti>=0){sellTank(ti);return;}
  const gi=hitGuest(p.x,p.y);
  if(gi>=0&&G.guests[gi]&&!G.guests[gi].leaving){const g=G.guests[gi];g.pop=1;seatGuest(g);return;}
  const ri=hitRoute(p.x,p.y);
  if(ri>=0){sendDispatch(ri);return;}
  const oi=hitOrder(p.x,p.y);
  if(oi>=0&&G.orders[oi]&&!G.orders[oi].leaving){const o=G.orders[oi];o.pop=1;fillOrder(o);return;}
  if(CLONE_BTN&&inRect(p,CLONE_BTN.x,CLONE_BTN.y,CLONE_BTN.w,CLONE_BTN.h)){tryClone();return;}
  if(inRect(p,BUILD_BTN.x,BUILD_BTN.y,BUILD_BTN.w,BUILD_BTN.h)){tryBuild();return;}
  const R=modRadius();let best=null,bd=1e9;
  G.mods.forEach(m=>{if(!m)return;const d=Math.hypot(p.x-m.x,p.y-m.y);
    if(d<R*1.6&&d<bd){bd=d;best=m;}});
  /* A TAP IS NOT A DRAG. Tap-verbs (crack a machine, plant a crop, harvest it)
     need a clean tap on a machine, while merging needs pick-up-and-carry. So a
     press only becomes a drag after the finger actually moves; a still finger
     that lifts is a tap and is offered to the active business's verb. */
  if(best){G.pending={mod:best,dx:best.x-p.x,dy:best.y-p.y,x0:p.x,y0:p.y};}
}
function tapMachine(m){
  if(crackOn()){
    if(!m.crackT&&!m.busy&&!m.hostT){startCrack(m);return;}
  }
  if(growOn()){
    if(m.crop&&m.crop.ripe&&!m.crop.over){harvestCrop(m);return;}
    if(!m.crop&&!m.busy&&!m.hostT&&!m.crackT){plantCrop(m);return;}
    if(m.crop&&!m.crop.ripe){toast('GROWING \u2014 harvest it when it glows',C.dim);return;}
  }
}
function onMove(e){
  const p=toDesign(e);ptr.x=p.x;ptr.y=p.y;
  if(G.pending&&G.scene==='play'){
    if(Math.hypot(p.x-G.pending.x0,p.y-G.pending.y0)>10){
      G.drag={mod:G.pending.mod,dx:G.pending.dx,dy:G.pending.dy};
      G.mods[G.pending.mod.slot]=null;G.pending=null;Audio2.ui();
    }
    return;
  }
  if(!G.drag||G.scene!=='play')return;
  const m=G.drag.mod;m.x=p.x+G.drag.dx;m.y=p.y+G.drag.dy;
  G.hoverSlot=-1;const R=modRadius();
  if(m.tier<MAXTIER)G.mods.forEach((o,i)=>{
    if(o&&i<m.slot+MAXSLOTS&&o.tier===m.tier&&Math.hypot(o.x-m.x,o.y-m.y)<R*2.15)G.hoverSlot=i;});
}
function onUp(){
  ptr.down=false;
  if(G.pending){const m=G.pending.mod;G.pending=null;
    if(G.scene==='play'&&m&&G.mods[m.slot]===m)tapMachine(m);
    return;}
  const d=G.drag;if(!d)return;
  const m=d.mod;G.drag=null;
  if(G.hoverSlot>=0&&G.mods[G.hoverSlot]&&G.mods[G.hoverSlot].tier===m.tier&&m.tier<MAXTIER){
    G.mods[m.slot]=m;doMerge(m,G.mods[G.hoverSlot]);
  }else{G.mods[m.slot]=m;m.returning=true;}
  G.hoverSlot=-1;recompute();
}
cvs.addEventListener('pointerdown',onDown,{passive:false});
cvs.addEventListener('pointermove',onMove,{passive:false});
cvs.addEventListener('pointerup',onUp,{passive:false});
cvs.addEventListener('pointercancel',onUp,{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(G.scene==='play')pauseGame();else if(G.scene==='paused')resumeGame();
    else if(G.scene==='streak'){Platform.clearPaused();G.scene='play';Audio2.ui();}}
  else if(e.key===' '&&G.scene==='play'){e.preventDefault();tryBuild();}
  else if(e.key==='m'||e.key==='M'){Audio2.setMuted(!Audio2.isMuted());Platform.setAudioEnabled(!Audio2.isMuted());}
});
function pauseGame(){if(G.scene!=='play')return;G.scene='paused';Audio2.suspend();Audio2.ui();}
function resumeGame(){Platform.clearPaused();G.scene='play';Audio2.resume();Audio2.ui();}
function startFresh(){
  Platform.save('best',Math.max(G.best,G.earned));
  if(G.earned>0){G.runs=(G.runs||0)+1;Platform.save('runs',G.runs);}
  Platform.save('run',null);
  newGame(true);G.hasSave=false;G.scene='play';layout();maybeTutorial();
  Audio2.resume();Audio2.ui();toast('New station online',C.mint);
  if(!G.readySent){Platform.gameReady();G.readySent=true;}
}
function restart(){Platform.clearPaused();startFresh();}
function continueGame(){
  if(loadGame()){
    Platform.clearPaused();layout();Audio2.resume();Audio2.ui();
    const r=Platform.load('run',null);
    G.pendingPile=offlinePile(r);
    G.awaySecs=r&&r.savedAt?Math.max(0,(Date.now()-r.savedAt)/1000):0;
    G.scene=G.pendingPile?'return':'returngoal';
  } else startFresh();
}
// Shown once ever (persisted), and always re-openable from the pause menu.
function maybeTutorial(force){
  if(force||!Platform.load('tutdone',0))TUT.start(); else TUT.stop();
}
function beginFromTitle(){
  Platform.clearPaused();G.scene='play';Audio2.ui();maybeTutorial();
  if(!G.readySent){Platform.gameReady();G.readySent=true;}
}
Platform.onPause(()=>{if(G&&G.scene==='play')pauseGame();});
Platform.onResume(()=>Audio2.resume());
Platform.onAudioChange(v=>Audio2.setMuted(!v));

/* =====================================================================
   10. UPDATE — fixed timestep, frame-rate independent
   ===================================================================== */
const STEP=1/120;let acc=0,last=performance.now();
function update(dt){
  if(G.scene!=='play')return;
  G.time+=dt;layout();

  // SURGE: a timed double-income window, triggered by the station itself so it
  // needs no new touch target and can never be missed by a distracted player.
  if(mechIndex()===1){
    if(G.surge>0){G.surge-=dt;if(G.surge<=0)toast('Surge ended',C.dim);}
    else{G.surgeCd=(G.surgeCd||45)-dt;
      if(G.surgeCd<=0){G.surge=12;G.surgeCd=60;G.stationGlow=1;
        toast('SURGE  \u00D72 income for 12s',C.goldLt);Audio2.fanfare();}}
  }
  const surgeMul=(mechIndex()===1&&G.surge>0)?(1+mechPot()):1;
  const gain=G.income*surgeMul*rushMul()*dt;G.coins+=gain;G.earned+=gain;
  G.incomeShown=damp(G.incomeShown,G.income,6,dt);
  // MONEY MUST BE VISIBLE. Every producing module emits coins that fly to the
  // counter, so a player who reads no text still learns "machines -> credits".
  G.mods.forEach(m=>{
    if(!m||m.tier<1)return;
    m.credT=(m.credT===undefined?Math.random()*0.9:m.credT)-dt;
    if(m.credT<=0){
      m.credT=Math.max(0.34,1.05-m.tier*0.08);
      spawnCred(m.x,m.y,TIER[m.tier-1].c,false);
      G.credPulse=Math.max(G.credPulse,0.3);
    }
  });
  G.credPulse=Math.max(0,G.credPulse-dt*2.4);
  TUT.update(dt);
  G.healT=(G.healT||2)-dt;
  if(G.healT<=0){G.healT=2;healCommission();}
  updateOrders(dt);
  updateEvents(dt);
  dailyTick();
  updateGuests(dt);
  updateCrack(dt);
  updateGrow(dt);
  updateDispatch(dt);
  if(G.dockedWhileAway)announceDocked();
  const vv=G.ventures&&G.ventures[G.activeV];
  if(vv&&vv.charterSeen==='pending'&&G.scene==='play'&&!G.drag){vv.charterSeen=true;G.scene='sector';Audio2.ui();}

  G.shipTimer-=dt;
  if(G.shipTimer<=0){G.shipTimer=Math.max(BAL.shipMin,BAL.shipEvery-G.stationTier*BAL.shipTierCut);spawnShip();}
  for(let i=G.ships.length-1;i>=0;i--){
    const s=G.ships[i];
    if(s.phase==='in'){s.t+=dt/s.dur;if(s.t>=1){s.t=1;s.phase='dock';s.wait=0.42;}}
    else if(s.phase==='dock'){
      s.wait-=dt;
      if(s.wait<=0&&!s.paid){
        s.paid=true;G.shipsDocked++;
        let pay=Math.round(BAL.shipBase+G.income*BAL.shipMul+G.stationTier*BAL.shipTierBonus);
        if(mechIndex()===2)pay=Math.round(pay*(1+0.5*mechPot()));
        if(mechIndex()===1&&G.surge>0)pay=Math.round(pay*(1+mechPot()));
        G.coins+=pay;G.earned+=pay;
        spawnCredStream(s.tx,s.ty-16,pay,C.goldLt);
        G.credPulse=1;
        floatTxt(s.tx,s.ty-52,'CARGO  +'+fmt(pay),C.goldLt,20);
        burstP(s.tx,s.ty,s.hue,12,120,0.5);
        Audio2.dock();G.hubPulse=Math.max(G.hubPulse,0.55);
        s.phase='out';s.t=0;
      }
    }else{s.t+=dt/1.15;if(s.t>=1)G.ships.splice(i,1);}
  }

  G.mods.forEach(m=>{
    if(!m)return;
    m.bob+=dt*1.5;m.spin+=dt*(0.3+m.tier*0.08);
    m.pop=damp(m.pop,1,9,dt);m.glow=damp(m.glow,0,3.2,dt);
    if(G.drag&&G.drag.mod===m)return;
    if(m.returning){
      m.x=damp(m.x,m.home.x,16,dt);m.y=damp(m.y,m.home.y,16,dt);
      if(Math.hypot(m.x-m.home.x,m.y-m.home.y)<0.7){m.x=m.home.x;m.y=m.home.y;m.returning=false;}
    }else{m.x=damp(m.x,m.home.x,14,dt);m.y=damp(m.y,m.home.y+Math.sin(m.bob)*3.4,14,dt);}
  });

  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.age+=dt;
    if(p.age>=p.life){G.parts.splice(i,1);continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=(1-2.1*dt);p.vy=p.vy*(1-2.1*dt)+46*dt;
  }
  for(let i=G.creds.length-1;i>=0;i--){
    const c=G.creds[i];c.t+=dt/c.life;
    if(c.t>=1){G.creds.splice(i,1);G.credPulse=1;continue;}
    // re-target live: the counter moves between portrait and landscape
    const t=credTarget();c.tx=t.x;c.ty=t.y;
  }
  for(let i=G.floats.length-1;i>=0;i--){
    const t=G.floats[i];t.age+=dt;
    if(t.age>=t.life){G.floats.splice(i,1);continue;}
    t.y+=t.vy*dt;t.vy*=(1-1.5*dt);
  }
  for(let i=G.rings.length-1;i>=0;i--){G.rings[i].age+=dt;if(G.rings[i].age>=G.rings[i].life)G.rings.splice(i,1);}

  // toast queue: delays are aged here, not by setTimeout, so a throttled
  // background tab can never drop a message or strand a state transition.
  G.queue.forEach(q=>q.age+=dt);
  G.queue=G.queue.filter(q=>q.age<q.life);
  const shown=G.queue.filter(q=>q.age>=0);
  G.toast=shown.length?shown[0]:null;

  // contract-spine completion, resolved from the simulation clock
  if(G.endless&&G.finishAt&&G.time>=G.finishAt){
    G.finishAt=0;G.scene='done';
    G.runs=(G.runs||0)+1;Platform.save('runs',G.runs);
    saveGame();
  }
  // autosave — progress must survive an abrupt tab close
  G.saveTimer=(G.saveTimer||0)-dt;
  if(G.saveTimer<=0){G.saveTimer=5;saveGame();}

  G.hubPulse=damp(G.hubPulse,0,4,dt);
  G.stationGlow=damp(G.stationGlow,0,2.2,dt);
  G.hubScale=damp(G.hubScale,1+G.hubPulse*0.09,8,dt);
  if(G.earned>G.best)G.best=G.earned;

  const pr=progress();
  if(!pr.all&&pr.cur>=pr.c.v)completeContract();
  else if(G.commissionGoal&&G.commissionGoal.deadline&&G.time>G.commissionGoal.deadline){
    G.commissionGoal=null;issueCommission();      // expired: post a fresh offer
    toast('Rush expired \u2014 a new commission is posted',C.dim);
  }
}
